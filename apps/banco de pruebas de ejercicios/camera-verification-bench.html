<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FitChallenge — Verificación por cámara</title>
    <style>
      :root {
        --bg: #030405;
        --surface: #12161c;
        --surface-2: #1a2028;
        --line: #262e37;
        --text: #edf1f5;
        --text-dim: #8a95a3;
        --volt: #2dd4a8;
        --volt-dim: #22a886;
        --ember: #ff5a36;
        --blue: #2e6bff;
        --danger: #ff5a5a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      }
      #app {
        max-width: 460px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 4px 10px 16px;
      }
      h1 {
        font-family: 'Archivo Black', 'Arial Black', sans-serif;
        font-size: 22px;
        line-height: 1.1;
        margin: 0;
        letter-spacing: -0.4px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--volt);
        font-weight: 700;
        display: block;
        margin-bottom: 6px;
      }
      p {
        color: var(--text-dim);
        font-size: 11px;
        line-height: 1.3;
        margin: 2px 0 0;
      }
      .video-wrap {
        position: relative;
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
        margin-top: 6px;
        background: #000;
        aspect-ratio: 9/19.5;
        max-height: calc(100vh - 200px);
        max-height: calc(100dvh - 200px);
      }
      video,
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      video {
        transform: scaleX(-1);
      }
      canvas {
        transform: scaleX(-1);
      }
      .no-mirror {
        transform: none;
      }
      .hud {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 5;
      }
      .badge {
        background: rgba(11, 14, 17, 0.75);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-dim);
      }
      .dot.live {
        background: var(--volt);
        box-shadow: 0 0 8px var(--volt);
      }
      .flip-btn {
        cursor: pointer;
      }
      .rep-hud {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 5;
      }
      .rep-count {
        font-family: 'Archivo Black', sans-serif;
        font-size: 80px;
        color: var(--volt);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
        line-height: 1;
      }
      .rep-label {
        font-size: 12px;
        color: #fff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        opacity: 0.9;
        font-weight: 700;
      }
      .state-msg {
        position: absolute;
        top: 44px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        background: rgba(11, 14, 17, 0.78);
        border-radius: 999px;
        padding: 5px 13px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        max-width: 92%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .state-msg.down {
        color: var(--blue);
      }
      .state-msg.up {
        color: var(--volt);
      }
      .state-msg.nobody {
        color: var(--danger);
      }
      .state-msg.blocked {
        color: var(--ember);
      }
      .checklist-hud {
        position: absolute;
        bottom: 12px;
        left: 10px;
        z-index: 5;
        background: rgba(11, 14, 17, 0.75);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 7px 9px;
        font-size: 9.5px;
        min-width: 92px;
      }
      .checklist-hud .cl-title {
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 3px;
      }
      .checklist-hud .cl-row {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 1px 0;
        color: var(--text-dim);
      }
      .checklist-hud .cl-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--danger);
        flex-shrink: 0;
      }
      .checklist-hud .cl-row.ok .cl-dot {
        background: var(--volt);
      }
      .checklist-hud .cl-row.ok span {
        color: var(--text);
      }
      .checklist-hud .cl-dbg {
        margin-left: auto;
        padding-left: 6px;
        font-size: 8px;
        color: var(--text-dim);
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .btn {
        display: block;
        width: 100%;
        text-align: center;
        border: none;
        border-radius: 14px;
        padding: 15px;
        font-family: 'Archivo Black', 'Arial Black', sans-serif;
        font-size: 14px;
        cursor: pointer;
        margin-top: 12px;
      }
      .btn-primary {
        background: var(--volt);
        color: #0b0e11;
      }
      .btn-ghost {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .log {
        font-family: ui-monospace, monospace;
        font-size: 10.5px;
        color: var(--text-dim);
        margin-top: 8px;
        max-height: 60px;
        overflow: auto;
      }
      .result {
        display: none;
      }
      .result.show {
        display: block;
      }
      .verify-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #16210c;
        border: 1px solid var(--volt-dim);
        color: var(--volt);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 11px;
        font-weight: 700;
        margin-top: 8px;
      }
      .verify-tag.broken {
        background: #210c0c;
        border-color: var(--danger);
        color: var(--danger);
      }
      .orientation-row {
        position: absolute;
        top: 76px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: center;
        z-index: 5;
      }
      .orientation-row .badge {
        border-color: var(--volt-dim);
        color: var(--volt);
      }
      .orientation-row .badge.orientation-bad {
        border-color: var(--danger);
        color: var(--danger);
        animation: pulse-warn 1s infinite;
      }
      @keyframes pulse-warn {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .target-chip {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
      }
      .voice-badge {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        max-width: 88%;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        color: #e8f5e9;
        font-size: 12px;
        line-height: 1.35;
        text-align: center;
        pointer-events: none;
      }
      .gesture-hud {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 6;
        width: 84%;
        text-align: center;
        background: rgba(11, 14, 17, 0.88);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px;
        display: none;
      }
      .gesture-hud .gesture-text {
        font-size: 14px;
        line-height: 1.4;
        color: var(--volt);
        font-weight: 700;
        margin: 0;
      }
      .countdown-overlay {
        position: absolute;
        inset: 0;
        z-index: 7;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(3, 4, 5, 0.55);
        font-family: 'Archivo Black', sans-serif;
        font-size: 120px;
        color: var(--volt);
        text-shadow: 0 0 32px rgba(45, 212, 168, 0.6);
      }
      .cadence-hud {
        position: absolute;
        top: 112px;
        right: 12px;
        z-index: 6;
        min-width: 72px;
        height: 72px;
        padding: 0 10px;
        border-radius: 36px;
        background: rgba(11, 14, 17, 0.9);
        border: 3px solid var(--volt);
        color: var(--volt);
        font-family: 'Archivo Black', sans-serif;
        font-size: 34px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 0 24px rgba(45, 212, 168, 0.45);
        align-items: center;
        justify-content: center;
        display: none;
      }
      .cadence-hud.urgent {
        border-color: var(--danger);
        color: var(--danger);
        box-shadow: 0 0 24px rgba(255, 90, 90, 0.55);
        animation: cadencePulse 0.5s ease-in-out infinite;
      }
      @keyframes cadencePulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.14);
        }
      }
      .liveness-overlay {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(3, 4, 5, 0.88);
        text-align: center;
      }
      .liveness-overlay .lv-line {
        font-family: 'Archivo Black', sans-serif;
        font-size: clamp(56px, 12vh, 140px);
        line-height: 1.05;
        letter-spacing: 2px;
        color: var(--volt);
        text-shadow: 0 0 36px rgba(45, 212, 168, 0.7);
        animation: lvPulse 1.1s ease-in-out infinite;
      }
      .liveness-overlay .lv-instruct {
        margin-top: 26px;
        max-width: 82%;
        font-size: clamp(16px, 3.6vh, 30px);
        font-weight: 700;
        color: #fff;
        background: rgba(11, 14, 17, 0.7);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 16px;
      }
      @keyframes lvPulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.65;
          transform: scale(0.97);
        }
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <p id="desc">Cargando instrucciones…</p>

      <div class="video-wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        <div class="hud">
          <div class="badge">
            <div class="dot" id="liveDot"></div>
            <span id="statusText">Cámara apagada</span>
          </div>
          <div class="badge flip-btn" id="flipBtn">
            <span id="flipIcon"></span><span id="facingLabel">Frontal</span>
          </div>
        </div>
        <div class="target-chip"><div class="badge" id="targetBadge">0/0</div></div>
        <div class="voice-badge" id="voiceBadge" style="display: none"></div>
        <div class="orientation-row">
          <div class="badge" id="orientationBadge" style="display: none">
            <span id="orientationIcon"></span><span id="orientationText">Vertical</span>
          </div>
        </div>
        <div class="state-msg" id="stateMsg" style="display: none"></div>
        <div class="checklist-hud" id="checklistHud" style="display: none">
          <div class="cl-title" id="clTitle">Cuerpo <span id="clCount">0/0</span></div>
          <div id="clRows"></div>
        </div>
        <div class="rep-hud">
          <div class="rep-count" id="repCount">0</div>
          <div class="rep-label" id="repLabel"></div>
        </div>
        <div class="gesture-hud" id="gestureHud">
          <p class="gesture-text" id="gestureText">
            Levantá la mano arriba de la cabeza para empezar
          </p>
        </div>
        <div class="countdown-overlay" id="countdownOverlay">5</div>
        <div class="cadence-hud" id="cadenceHud">5</div>
        <div class="liveness-overlay" id="livenessOverlay">
          <div class="lv-line">SEÑAL</div>
          <div class="lv-line">DE</div>
          <div class="lv-line">VIDA</div>
          <p class="lv-instruct" id="livenessInstruct"></p>
        </div>
      </div>

      <button class="btn btn-primary" id="startBtn">Activar cámara</button>
      <button class="btn btn-ghost" id="stopBtn" style="display: none">
        Finalizar y verificar serie
      </button>

      <div class="card result" id="resultCard">
        <span class="eyebrow">Resultado</span>
        <h1 id="resultReps">0</h1>
        <p id="resultDetail"></p>
        <div class="verify-tag" id="verifyTag">
          <span id="verifyText">Evidencia de pose — verificación en el dispositivo</span>
        </div>
      </div>
      <div class="log" id="log"></div>
    </div>

    <script type="module">
      import {
        PoseLandmarker,
        FilesetResolver,
        DrawingUtils,
      } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

      const qs = new URLSearchParams(location.search);
      const readTarget = (raw, fallback) => {
        const n = parseInt(raw, 10);
        return Number.isFinite(n) && n > 0 ? n : fallback;
      };
      // Secuencia: `seq=id:objetivo,id:objetivo,...`. Sin `seq` es un solo
      // ejercicio (`exercise` + `target`), como antes. La unidad de cada
      // ejercicio sale de su CFG, no de la URL.
      const SEQ = (qs.get('seq') || '')
        .split(',')
        .map((part) => {
          const [id, t] = part.split(':');
          return { id: String(id || '').trim(), target: readTarget(t, 10) };
        })
        .filter((s) => s.id);
      if (!SEQ.length) {
        SEQ.push({
          id: qs.get('exercise') || 'sentadillas',
          target: readTarget(qs.get('target'), 10),
        });
      }
      const EX_ID = SEQ[0].id;
      const MODE_RANKED = qs.get('ranked') === '1';
      const CADENCE_SEC = Math.min(
        15,
        Math.max(
          2,
          Number.isFinite(parseInt(qs.get('cadence'), 10)) ? parseInt(qs.get('cadence'), 10) : 6,
        ),
      );
      const CADENCE_MS = CADENCE_SEC * 1000;
      const VERIFY_VERSION = Number.isFinite(parseInt(qs.get('v') || '1', 10))
        ? Math.max(1, parseInt(qs.get('v') || '1', 10))
        : 1;

      const video = document.getElementById('video');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const repCountEl = document.getElementById('repCount');
      const repLabelEl = document.getElementById('repLabel');
      const stateMsg = document.getElementById('stateMsg');
      const statusText = document.getElementById('statusText');
      const liveDot = document.getElementById('liveDot');
      const logEl = document.getElementById('log');
      const targetBadge = document.getElementById('targetBadge');
      const voiceBadge = document.getElementById('voiceBadge');
      const checklistHud = document.getElementById('checklistHud');
      const clTitle = document.getElementById('clTitle');
      const clRows = document.getElementById('clRows');
      const resultCard = document.getElementById('resultCard');
      const resultReps = document.getElementById('resultReps');
      const resultDetail = document.getElementById('resultDetail');
      const verifyText = document.getElementById('verifyText');
      const flipBtn = document.getElementById('flipBtn');
      const flipIcon = document.getElementById('flipIcon');
      const facingLabel = document.getElementById('facingLabel');
      const orientationBadge = document.getElementById('orientationBadge');
      const orientationIcon = document.getElementById('orientationIcon');
      const orientationText = document.getElementById('orientationText');
      const gestureHud = document.getElementById('gestureHud');
      const gestureText = document.getElementById('gestureText');
      const countdownOverlay = document.getElementById('countdownOverlay');
      const cadenceHud = document.getElementById('cadenceHud');
      const livenessOverlay = document.getElementById('livenessOverlay');
      const livenessInstruct = document.getElementById('livenessInstruct');
      const descEl = document.getElementById('desc');

      const NAME = {
        sentadillas: 'Sentadillas',
        flexiones: 'Flexiones',
        abdominales: 'Abdominales',
        elevacion_piernas: 'Elevación de piernas',
        plancha: 'Plancha',
        zancadas: 'Zancadas',
        puente_gluteo: 'Puente de glúteo',
        mountain_climbers: 'Mountain Climbers',
        sentadilla_isometrica: 'Sentadilla isométrica',
        zancada_reversa: 'Zancada reversa',
        zancada_lateral: 'Zancada lateral',
        sentadilla_bulgara: 'Sentadilla búlgara',
        patada_gluteo: 'Patada de glúteo',
        elevacion_lateral_pierna: 'Elevación lateral de pierna',
        flexion_rodillas: 'Flexión de rodillas',
        flexion_declinada: 'Flexión declinada',
        flexion_pica: 'Flexión pica',
        fondos_silla: 'Fondos en silla',
        superman: 'Superman',
        encogimiento_inverso: 'Encogimiento inverso',
        encogimiento_bicicleta: 'Encogimiento bicicleta',
        burpee: 'Burpee',
        rodillas_altas: 'Rodillas altas',
      };
      document.title = NAME[EX_ID] || 'Verificación';

      const HOWTO = {
        sentadillas:
          'Parate derecho frente a la cámara con los pies al ancho de los hombros. Bajá llevando la cadera hacia atrás hasta que tus rodillas queden cerca de 90° y volvé a subir. Cada bajada y subida completa cuenta como 1.',
        flexiones:
          'Apoyá las manos a la altura de los hombros y estirá el cuerpo en plancha. Bajá el pecho doblando los codos hasta casi tocar el piso y volvé arriba empujando. Mantené el cuerpo recto todo el tiempo. Para arrancar, ponete en cuclillas listo para tomar la posición de plancha: tenés 10 segundos para hacer la primera flexión.',
        abdominales:
          'Recostate boca arriba con las rodillas flexionadas y los pies apoyados. Llevá el pecho hacia las rodillas contrayendo el abdomen y volvé a apoyar la espalda. Cada subida completa cuenta como 1.',
        elevacion_piernas:
          'Recostate boca arriba con las piernas extendidas y los brazos a los costados. Mantené la espalda baja apoyada y elevá las piernas rectas hasta que queden perpendiculares al torso; bajalas con control sin tocar el piso. Cada subida completa cuenta como 1.',
        plancha:
          'Pará en plancha con los brazos extendidos y el cuerpo formando una línea recta de la cabeza a los pies. Mantené la posición sin bajar la cadera hasta completar el tiempo.',
        zancadas:
          'Ponete de perfil a la cámara, mirando hacia un costado. Da un paso largo hacia adelante y bajá flexionando las rodillas hasta cerca de 90°; volvé a subir y repetá alternando la pierna. Cada subida completa cuenta como 1.',
        puente_gluteo:
          'Recostate boca arriba con las rodillas flexionadas y los pies apoyados. Elevá la cadera apretando los glúteos, mantené un segundo y bajá hasta apoyarla. Cada subida cuenta como 1.',
        mountain_climbers:
          'Ponete de perfil a la cámara (de costado), en plancha apoyando las manos. Llevá una rodilla rápido al pecho y volvé, alternando las piernas en ritmo continuo. Cada rodilla al pecho cuenta como 1.',
        sentadilla_isometrica:
          'Parate derecho y bajá a una sentadilla hasta que tus rodillas queden cerca de 90°. Mantené la posición sin subir hasta completar el tiempo.',
        zancada_reversa:
          'Ponete de perfil a la cámara, mirando hacia un costado. Da un paso largo hacia atrás y bajá flexionando las rodillas hasta cerca de 90°; volvé a subir y repetá alternando la pierna. Cada subida completa cuenta como 1.',
        zancada_lateral:
          'Ponete de perfil (o levemente de costado) a la cámara. Da un paso amplio hacia un costado y bajá flexionando esa rodilla mientras la otra pierna queda estirada; volvé al centro. Cada bajada y subida cuenta como 1.',
        sentadilla_bulgara:
          'Ponete de perfil a la cámara con el empeine del pie de atrás apoyado en una silla. Bajá flexionando la pierna de adelante hasta cerca de 90° y volvé a subir. Cada subida completa cuenta como 1.',
        patada_gluteo:
          'Ponete en cuadrupedia de perfil a la cámara (manos y rodillas apoyadas). Mantené la rodilla flexionada y llevá el pie hacia arriba y atrás apretando el glúteo; volvé sin apoyar. Cada patada cuenta como 1.',
        elevacion_lateral_pierna:
          'Recostate de costado mirando a la cámara, con las piernas juntas y estiradas. Elevá la pierna de arriba sin mover la cadera y bajala con control. Cada elevación cuenta como 1.',
        flexion_rodillas:
          'Apoyá las rodillas en el piso y las manos a la altura de los hombros. Mantené el cuerpo recto desde la cabeza hasta las rodillas, bajá doblando los codos y volvé a subir. Cada flexión completa cuenta como 1.',
        flexion_declinada:
          'Ponete de perfil en plancha con los pies elevados sobre una silla y las manos en el piso. Bajá el pecho doblando los codos y volvé a subir manteniendo el cuerpo recto. Cada flexión completa cuenta como 1.',
        flexion_pica:
          'Ponete de perfil con las manos y los pies en el piso y la cadera bien alta (V invertida). Bajá la cabeza doblando los codos y volvé a subir. Cada flexión cuenta como 1.',
        fondos_silla:
          'Ponete de perfil a la cámara sentado al borde de una silla, con las manos apoyadas en el borde por detrás. Bajá la cadera flexionando los codos y volvé a subir. Cada fondo cuenta como 1.',
        superman:
          'Recostate boca abajo con brazos y piernas extendidos. Elevá al mismo tiempo brazos y piernas del piso apretando la espalda baja y bajá con control. Cada elevación cuenta como 1.',
        encogimiento_inverso:

      function renderResultCard(detail) {

      function waitForRestart(msg, reason) {

      }
      function advance() {

          const rest = voiceTake('rest');

          go('Nueva serie');
          return;

        if (seqFinished) {

          loadExercise(0);
          go('Empezamos de nuevo: ' + (NAME[SEQ[0].id] || ''));

      function restartTick(pose) {

      function postComplete(detail) {

          showState('state-msg up', 'META CUMPLIDA');

            'complete',

          startBtn.disabled = false;

      }

      const RAISE_MIN_FRAMES = 4;
      const RAISE_NOSE_MARGIN = 0.06;
      function handIsRaised(r) {
        const lm = r.landmarks && r.landmarks[0];
        if (!lm || lm.length < 17) return false;
        const noseY = lm[LID.nose].y;
        if (noseY < 0.05 || noseY > 0.95) return false;
        const raisedY = Math.min(lm[LID.left_wrist].y, lm[LID.right_wrist].y);
        return raisedY < noseY - RAISE_NOSE_MARGIN;
      }
      function startGesture() {

        raiseStreak = 0;

        gestureHud.style.display = 'block';
        gestureText.textContent = 'Levantá la mano arriba de la cabeza para empezar';
        speak('Levantá la mano arriba de la cabeza para empezar');
      }
      function gestureTick(pose) {

        }
        if (!pose) return;
        if (!bodyComplete) {
          raiseStreak = 0;
          gestureText.textContent = bodyMissing.length
            ? 'Completá el cuerpo en cámara — falta ver: ' +
              bodyMissing.map((m) => LABEL[m]).join(', ')
            : 'Cuerpo incompleto — acomodate frente a la cámara';

      function processFrontal(lm) {

      function processLateral(lm) {

            candidateState = null;
            candidateStreak = 0;

            candidateStreak = 0;

          if (line != null) {
            lineAngleHistory.push(line);
            if (lineAngleHistory.length > 5) lineAngleHistory.shift();
            const sl = lineAngleHistory.reduce((a, b) => a + b, 0) / lineAngleHistory.length;
            if (cfg.lineMin && sl < cfg.lineMin) {
              candidateState = null;
              candidateStreak = 0;
              repStateInitialized = false;
              calibBuffer = [];
              dynamicDownThresh = null;
              dynamicUpThresh = null;
              showState('state-msg blocked', 'Alineá el cuerpo (cadera alta o hundida)');
              return;
            }
          }
        }
        if (cfg.liveness === 'hand' && repStateInitialized && checkHandLiveness(lm)) return;

        // mountain climbers / rodillas altas: conteo por pliegue de rodilla
        if (cfg.kneeFold) {
          const ka = angleBetween(lm[LID[sc.knee.a]], lm[LID[sc.knee.b]], lm[LID[sc.knee.c]]);
          if (ka == null) return;
          angleHistory.push(ka);
          if (angleHistory.length > 5) angleHistory.shift();
          const sk = angleHistory.reduce((a, b) => a + b, 0) / angleHistory.length;
          if (!repStateInitialized) {
            if (!attemptCalibration(sk, { downDelta: 0, upDelta: 0 })) {
              showState('state-msg blocked', 'Entrá en plancha de perfil');
              return;
            }
            repStateInitialized = true;
            scheduleLiveness();
            announceSession();
            showState('state-msg blocked', '¡Listo! Arrancá');
            return;
          }
          if (MODE_RANKED && !gestureStarted) {
            showState(
              'state-msg blocked',
              'Levantá la mano arriba de la cabeza para empezar a contar',
            );
            return;
          }
          const folded = sk < cfg.kneeFold;
          if (folded && repState !== 'fold') {
            repState = 'fold';
          } else if (!folded && repState === 'fold') {
            repState = 'up';
            const now = performance.now();
            if (now - lastRepTime >= MIN_REP_INTERVAL_MS) {
              lastRepTime = now;
              registerRep();
            }
          }
          showState(
            folded ? 'state-msg down' : 'state-msg up',
            folded ? 'RODILLA AL PECHO' : 'ARRIBA',
          );
          return;
        }

        // metric 'ratio': usa la altura cadera-tobillo normalizada por el torso
        // en vez de un íngulo (p. ej. burpee: parado = ratio alto, plancha = ratio bajo).
        const ang =
          cfg.metric === 'ratio'
            ? groundedRatio(
                lm[LID[side + '_hip']],
                lm[LID[side + '_ankle']],
                lm[LID[side + '_shoulder']],
              )
            : angleBetween(lm[LID[sc.angle.a]], lm[LID[sc.angle.b]], lm[LID[sc.angle.c]]);
        if (ang == null) return;
        angleHistory.push(ang);
        if (angleHistory.length > 7) angleHistory.shift();
        const smoothed = angleHistory.reduce((a, b) => a + b, 0) / angleHistory.length;

        if (!repStateInitialized) {
          if (cfg.restTorsoMax) {
            const shoulder = lm[LID[side + '_shoulder']],
              hip = lm[LID[side + '_hip']];
            if (torsoHorizontalAngle(shoulder, hip) > cfg.restTorsoMax) {
              calibBuffer = [];
              showState('state-msg blocked', cfg.startMsg);
              return;
            }
          }
          const calibrated = attemptCalibration(smoothed, cfg);
          showState(
            'state-msg blocked',
            calibrated
              ? '¡Listo! Empezá cuando quieras'
              : cfg.startMsg + ' (quedate quieto un segundo)',
          );
          if (calibrated) {
            repState = 'up';
            repStateInitialized = true;
            scheduleLiveness();
            announceSession();
          }
          return;
        }

        if (cfg.liveness === 'hold' && checkHoldLiveness(smoothed, dynamicDownThresh)) return;

        if (targetUnit === 'seconds') {
          // hold: cuenta tiempo en posición vílida (p. ej. plancha = brazos extendidos)
          if (MODE_RANKED && !gestureStarted) {
            showState(
              'state-msg blocked',
              'Levantá la mano arriba de la cabeza para empezar a contar',
            );
            return;
          }
          const holdOk = smoothed > dynamicUpThresh;
          const now = performance.now();
          if (holdOk) {
            if (lastHoldOk === null) lastHoldOk = now;
            else ((holdMs += now - lastHoldOk), (lastHoldOk = now));
            if (holdMs / 1000 >= targetVal) {
              postComplete('Tiempo logrado: ' + Math.floor(holdMs / 1000) + 's');
            }
          } else lastHoldOk = null;
          repCountEl.textContent = Math.min(targetVal, Math.floor(holdMs / 1000));
          refreshHud();
          if (holdOk) showState('state-msg up', 'SOSTENÉ ' + Math.floor(holdMs / 1000) + 's');
          else showState('state-msg blocked', 'Fuera de posición');
          return;
        }

        let cand = null;
        if (cfg.bridge) {
          if (smoothed > dynamicDownThresh) cand = 'down';
          else if (smoothed < dynamicUpThresh) cand = 'up';
        } else {
          if (smoothed < dynamicDownThresh) cand = 'down';
          else if (smoothed > dynamicUpThresh) cand = 'up';
        }
        if (MODE_RANKED && !gestureStarted) {
          showState(
            'state-msg blocked',
            'Levantá la mano arriba de la cabeza para empezar a contar',
          );
          return;
        }
        evaluateTransitionCalibrated(cand);
        const tag = cfg.metric === 'ratio' ? '' : ' (' + Math.round(smoothed) + '°)';
        if (cand === 'down') showState('state-msg down', 'ABAJO' + tag);
        else if (cand === 'up') showState('state-msg up', 'ARRIBA' + tag);
      }

      function draw(result) {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (result.landmarks && result.landmarks.length) {
          const du = new DrawingUtils(ctx);
          let pts = [];
          if (cfg.type === 'frontal') pts = FRONTAL_POINTS;
          else if (confirmedSide && cfg.sides[confirmedSide]) pts = cfg.sides[confirmedSide].points;
          for (const lm of result.landmarks) {
            du.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, {
              color: '#3A4552',
              lineWidth: 2,
            });
            for (const k of pts) {
              const p = lm[LID[k]];
              if (!p) continue;
              const ok = isLandmarkValid(lm, k);
              ctx.beginPath();
              ctx.arc(p.x * canvas.width, p.y * canvas.height, ok ? 5 : 6, 0, 2 * Math.PI);
              ctx.fillStyle = ok ? '#C8FF3D' : '#FF5A5A';
              ctx.fill();
              if (!ok) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#FF5A5A';
                ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, 10, 0, 2 * Math.PI);
                ctx.stroke();
              }
            }
          }
        }
        ctx.restore();
      }

      let currentFacing = 'user';
      function applyMirror() {
        const mirror = currentFacing === 'user';
        video.classList.toggle('no-mirror', !mirror);
        canvas.classList.toggle('no-mirror', !mirror);
      }
      flipBtn.onclick = async () => {
        currentFacing = currentFacing === 'user' ? 'environment' : 'user';
        facingLabel.textContent = currentFacing === 'user' ? 'Frontal' : 'Trasera';
        applyMirror();
        if (running) {
          const old = video.srcObject;
          if (old) old.getTracks().forEach((t) => t.stop());
          try {
            const ns = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: currentFacing },
              audio: false,
            });
            video.srcObject = ns;
            await video.play();
            log('Cámara cambiada');
          } catch (e) {
            log('No se pudo cambiar: ' + e.message);
          }
        }
      };

      let lastTime = -1;
      function loop() {
        if (!running) return;
        const now = performance.now();
        if (video.currentTime !== lastTime) {
          lastTime = video.currentTime;
          const r = poseLandmarker.detectForVideo(video, now);
          draw(r);
          processPose(r);
          if (MODE_RANKED) gestureTick(r);
          if (awaitingRestart) restartTick(r);
        }
        if (MODE_RANKED) {
          readyTick(now);
          cadenceTick(now);
        }
        requestAnimationFrame(loop);
      }

      function withTimeout(promise, ms, label) {
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error(label + ' (demoró ' + ms + 'ms)')), ms);
          promise.then(
            (v) => {
              clearTimeout(t);
              resolve(v);
            },
            (e) => {
              clearTimeout(t);
              reject(e);
            },
          );
        });
      }
      const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
      const MODEL_URL =
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';
      const MODEL_LOAD_MS = 20000;

      async function attemptCreate(label, make) {
        try {
          return await withTimeout(make('GPU'), MODEL_LOAD_MS, label + ' GPU');
        } catch (e) {
          log(label + ' GPU no disponible (' + e.message + '). Reintentando con CPU…');
          return await withTimeout(make('CPU'), MODEL_LOAD_MS, label + ' CPU');
        }
      }

      async function initModel() {
        statusText.textContent = 'Cargando modelo…';
        try {
          const vision = await withTimeout(
            FilesetResolver.forVisionTasks(WASM_URL),
            MODEL_LOAD_MS,
            'modelo',
          );
          poseLandmarker = await attemptCreate('pose', (delegate) =>
            PoseLandmarker.createFromOptions(vision, {
              baseOptions: { modelAssetPath: MODEL_URL, delegate },
              runningMode: 'VIDEO',
              numPoses: 1,
            }),
          );
          log('Modelo de pose cargado');
        } catch (e) {
          throw new Error('El modelo no cargó (' + e.message + ')');
        }
      }

      async function ensureOrientationSensor() {
        if (typeof DeviceOrientationEvent === 'undefined') return false;
        if (runningInsideReactNative) {
          // El WebView de Expo Go no entrega orientación sin gesto; la app lee
          // el sensor con expo-sensors y nos lo inyecta por este puente.
          post('sensor_request', {});
        } else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const perm = await DeviceOrientationEvent.requestPermission();
            if (perm !== 'granted') return false;
          } catch (e) {
            log('Sensor: ' + e.message);
            return false;
          }
        }
        window.addEventListener('deviceorientation', onDeviceOrientation);
        window.addEventListener('devicemotion', onDeviceMotion);
        return new Promise((res) => {
          const st = performance.now();
          (function ch() {
            if (orientationSupported) {
              res(true);
              return;
            }
            if (sensorUnavailable) {
              res(false);
              return;
            }
            if (performance.now() - st > SENSOR_CONFIRM_MS) {
              res(false);
              return;
            }
            requestAnimationFrame(ch);
          })();
        });
      }
      function onDeviceOrientation(ev) {
        if (ev.beta == null) return;
        betaHistory.push(ev.beta);
        if (betaHistory.length > 8) betaHistory.shift();
        const avg = betaHistory.reduce((a, b) => a + b, 0) / betaHistory.length;
        const dev = Math.abs(90 - Math.abs(avg));
        setOrientationState(dev <= VERTICAL_TOLERANCE);
      }
      function onDeviceMotion(ev) {
        const g = ev.accelerationIncludingGravity;
        if (!g || !Number.isFinite(g.y) || !Number.isFinite(g.z)) return;
        if (Math.hypot(g.y, g.z) < 1) return;
        const tilt = (Math.atan2(Math.abs(g.z), Math.abs(g.y)) * 180) / Math.PI;
        setOrientationState(tilt <= VERTICAL_TOLERANCE);
      }
      function setOrientationState(vertical, beta) {
        orientationSupported = true;
        deviceIsVertical = vertical;
        if (typeof beta === 'number' && Number.isFinite(beta)) {
          betaHistory.push(beta);
          if (betaHistory.length > 8) betaHistory.shift();
        }
        orientationBadge.style.display = 'flex';
        orientationBadge.className = 'badge ' + (deviceIsVertical ? '' : 'orientation-bad');
        orientationIcon.innerHTML = deviceIsVertical ? ICON.check : ICON.warning;
        orientationText.textContent = deviceIsVertical ? 'Vertical' : '¡Poné el celular vertical!';
      }

      // Puente nativo: la app (Expo) lee el sensor con expo-sensors y nos
      // inyecta la orientación. Dentro del WebView de Expo Go los eventos
      // deviceorientation/devicemotion NO llegan sin un gesto del usuario;
      // este hook evita depender del gesto y del WebView para el sensor.
      window.__resilienciaSetNativeOrientation = function (sample) {
        if (!sample) return;
        if (sample.available === false) {
          sensorUnavailable = true;
          return;
        }
        if (sample.available !== true || typeof sample.vertical !== 'boolean') return;
        setOrientationState(sample.vertical, sample.beta);
      };

      async function startCamera() {
        startBtn.disabled = true;
        startBtn.textContent = 'Confirmando sensor…';
        ensureAudio();
        const sensorOk = await ensureOrientationSensor();
        if (!sensorOk) {
          if (sensorConfirmRetries < 1) {
            sensorConfirmRetries += 1;
            statusText.textContent = 'Confirmando sensor de nuevo…';
            setTimeout(() => void startCamera(), 300);
            return;
          }
          sensorConfirmRetries = 0;
          log('Sensor no confirmado — modo verificado exige celular vertical');
          startBtn.disabled = false;
          startBtn.textContent = 'Reintentar';
          statusText.textContent = 'Sensor no confirmado';
          return;
        }
        sensorConfirmRetries = 0;
        try {
          if (!poseLandmarker) await initModel();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacing },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
          canvas.width = video.videoWidth || 480;
          canvas.height = video.videoHeight || 640;
          running = true;
          resetRepState();
          applyMirror();
          if (MODE_RANKED) {
            startGesture();
          }
          startBtn.style.display = 'none';
          stopBtn.style.display = 'block';
          statusText.textContent = 'En vivo';
          liveDot.classList.add('live');
          log(
            'Cámara activa · ' +
              cfg.name +
              ' · ' +
              (cfg.unit === 'seconds' ? targetVal + 's' : targetVal + ' reps'),
          );
          requestAnimationFrame(loop);
        } catch (e) {
          log('Error: ' + e.message);
          statusText.textContent = 'Sin acceso a cámara';
          startBtn.disabled = false;
          startBtn.textContent = 'Activar cámara';
        }
      }
      function stopCamera() {
        running = false;
        const s = video.srcObject;
        if (s) s.getTracks().forEach((t) => t.stop());
        liveDot.classList.remove('live');
        statusText.textContent = 'Detenido';
        stopBtn.style.display = 'none';
        startBtn.style.display = 'block';
        startBtn.disabled = false;
        startBtn.textContent = 'Reiniciar';
        stateMsg.style.display = 'none';
        checklistHud.style.display = 'none';
        gestureHud.style.display = 'none';
        countdownOverlay.style.display = 'none';
        cadenceHud.style.display = 'none';
        hideLiveness();
        renderResultCard('Sesión finalizada');
      }
      startBtn.onclick = startCamera;
      stopBtn.onclick = stopCamera;
      loadExercise(0);

      setTimeout(() => {
        if (!startBtn.disabled) startCamera();
      }, 700);
    </script>
  </body>
</html>
