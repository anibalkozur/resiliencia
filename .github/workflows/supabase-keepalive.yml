name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/exercises?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Keep-alive falló: el proyecto puede estar pausado."
            exit 1
          fi
