<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FitChallenge — Verificación por cámara</title>
    <style>
      :root {
        --bg: #030405;
        --surface: #12161c;
        --surface-2: #1a2028;
        --line: #262e37;
        --text: #edf1f5;
        --text-dim: #8a95a3;
        --volt: #2dd4a8;
        --volt-dim: #22a886;
        --ember: #ff5a36;
        --blue: #2e6bff;
        --danger: #ff5a5a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      }
      #app {
        max-width: 460px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 0 14px;
      }
      h1 {
        font-family: 'Archivo Black', 'Arial Black', sans-serif;
        font-size: 22px;
        line-height: 1.1;
        margin: 0;
        letter-spacing: -0.4px;
      }
      p {
        color: var(--text-dim);
        font-size: 12.5px;
        line-height: 1.5;
        margin: 6px 0 0;
      }
      .video-wrap {
        position: relative;
        flex: 1;
        margin: 0 -14px;
        border-radius: 0;
        overflow: hidden;
        background: #000;
      }
      video,
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      video {
        transform: scaleX(-1);
      }
      canvas {
        transform: scaleX(-1);
      }
      .no-mirror {
        transform: none;
      }
      .hud {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: none;
        justify-content: space-between;
        align-items: center;
        z-index: 5;
      }
      .badge {
        background: rgba(11, 14, 17, 0.75);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-dim);
      }
      .dot.live {
        background: var(--volt);
        box-shadow: 0 0 8px var(--volt);
      }
      .flip-btn {
        cursor: pointer;
      }
      .rep-hud {
        position: absolute;
        right: 12px;
        bottom: 12px;
        text-align: right;
        z-index: 5;
      }
      .rep-count {
        font-family: 'Archivo Black', sans-serif;
        font-size: 80px;
        color: var(--volt);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
        line-height: 1;
      }
      .checklist-hud {
        position: absolute;
        bottom: 12px;
        left: 10px;
        z-index: 5;
        background: rgba(11, 14, 17, 0.75);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 7px 9px;
        font-size: 9.5px;
        min-width: 92px;
      }
      .checklist-hud .cl-title {
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 3px;
      }
      .checklist-hud .cl-row {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 1px 0;
        color: var(--text-dim);
      }
      .checklist-hud .cl-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--danger);
        flex-shrink: 0;
      }
      .checklist-hud .cl-row.ok .cl-dot {
        background: var(--volt);
      }
      .checklist-hud .cl-row.ok span {
        color: var(--text);
      }
      .btn {
        display: block;
        width: 100%;
        text-align: center;
        border: none;
        border-radius: 14px;
        padding: 15px;
        font-family: 'Archivo Black', 'Arial Black', sans-serif;
        font-size: 14px;
        cursor: pointer;
        margin-top: 12px;
      }
      .btn-primary {
        background: var(--volt);
        color: #0b0e11;
      }
      .btn-ghost {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .log {
        font-family: ui-monospace, monospace;
        font-size: 10.5px;
        color: var(--text-dim);
        margin-top: 8px;
        max-height: 60px;
        overflow: auto;
      }
      .orientation-row {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: center;
        z-index: 5;
      }
      .orientation-row .badge {
        border-color: var(--volt-dim);
        color: var(--volt);
      }
      .orientation-row .badge.orientation-bad {
        border-color: var(--danger);
        color: var(--danger);
        animation: pulse-warn 1s infinite;
      }
      @keyframes pulse-warn {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .target-chip {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        display: none;
      }
      .voice-badge {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        max-width: 88%;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        color: #e8f5e9;
        font-size: 12px;
        line-height: 1.35;
        text-align: center;
        pointer-events: none;
      }
      .dwell-btn {
        position: absolute;
        top: 40px;
        z-index: 9;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 21px 8px;
        border-radius: 999px;
        border: none;
        color: #07100c;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
      }
      .dwell-btn.exit {
        background: var(--danger);
        color: #fff;
        --btn: var(--danger);
        --dwell: #ffffff;
        --track: rgba(0, 0, 0, 0.35);
      }
      .action-row {
        position: absolute;
        top: 40px;
        left: 0;
        right: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 10px;
        box-sizing: border-box;
      }
      .action-row .dwell-btn {
        position: static;
        flex: 0 1 auto;
        min-width: 0;
      }
      .action-row .dwell-btn.repeat {
        min-width: 146px;
      }
      .dwell-btn.next {
        background: var(--blue);
        color: #fff;
        --btn: var(--blue);
        --dwell: #ffffff;
        --track: rgba(255, 255, 255, 0.3);
      }
      .action-row.trio {
        justify-content: space-between;
        gap: 6px;
      }
      .action-row.trio .dwell-btn {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        padding: 21px 8px;
        font-size: 14px;
        letter-spacing: 1.2px;
      }
      .action-row.trio .dwell-btn.repeat {
        min-width: 0;
      }
      .action-row.trio .dwell-ring {
        width: 26px;
        height: 26px;
      }
      .dwell-btn.repeat {
        right: 0;
        background: var(--volt);
        color: #07100c;
        --btn: var(--volt);
        --dwell: #ffffff;
        --track: rgba(7, 16, 12, 0.22);
        box-sizing: border-box;
        min-width: 146px;
        min-height: 71px;
        justify-content: center;
      }
      .dwell-btn.repeat.posture .dwell-ring {
        display: none;
      }
      .dwell-btn.repeat.posture-falta {
        background: var(--ember);
        color: #1a0a04;
        --btn: var(--ember);
        --track: rgba(26, 10, 4, 0.28);
      }
      .dwell-ring {
        position: relative;
        flex: 0 0 auto;
        width: 29px;
        height: 29px;
        border-radius: 50%;
        background: conic-gradient(
          var(--dwell, #fff) calc(var(--p, 0) * 1%),
          var(--track, rgba(0, 0, 0, 0.35)) 0
        );
      }
      .dwell-ring::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: var(--btn, rgba(11, 14, 17, 0.92));
      }
      .gesture-hud {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 6;
        width: 84%;
        text-align: center;
        background: rgba(11, 14, 17, 0.88);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px;
        display: none;
      }
      .gesture-hud .gesture-text {
        font-size: 14px;
        line-height: 1.4;
        color: var(--volt);
        font-weight: 700;
        margin: 0;
      }
      .countdown-overlay {
        position: absolute;
        inset: 0;
        z-index: 7;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(3, 4, 5, 0.55);
        font-family: 'Archivo Black', sans-serif;
        font-size: 120px;
        color: var(--volt);
        text-shadow: 0 0 32px rgba(45, 212, 168, 0.6);
      }
      .cadence-hud {
        position: absolute;
        top: 112px;
        right: 12px;
        z-index: 6;
        min-width: 72px;
        height: 72px;
        padding: 0 10px;
        border-radius: 36px;
        background: rgba(11, 14, 17, 0.9);
        border: 3px solid var(--volt);
        color: var(--volt);
        font-family: 'Archivo Black', sans-serif;
        font-size: 34px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 0 24px rgba(45, 212, 168, 0.45);
        align-items: center;
        justify-content: center;
        display: none;
      }
      .cadence-hud.urgent {
        border-color: var(--danger);
        color: var(--danger);
        box-shadow: 0 0 24px rgba(255, 90, 90, 0.55);
        animation: cadencePulse 0.5s ease-in-out infinite;
      }
      @keyframes cadencePulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.14);
        }
      }
      .liveness-overlay {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(3, 4, 5, 0.88);
        text-align: center;
      }
      .liveness-overlay .lv-line {
        font-family: 'Archivo Black', sans-serif;
        font-size: clamp(56px, 12vh, 140px);
        line-height: 1.05;
        letter-spacing: 2px;
        color: var(--volt);
        text-shadow: 0 0 36px rgba(45, 212, 168, 0.7);
        animation: lvPulse 1.1s ease-in-out infinite;
      }
      .liveness-overlay .lv-instruct {
        margin-top: 26px;
        max-width: 82%;
        font-size: clamp(16px, 3.6vh, 30px);
        font-weight: 700;
        color: #fff;
        background: rgba(11, 14, 17, 0.7);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 16px;
      }
      @keyframes lvPulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.65;
          transform: scale(0.97);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="video-wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        <div class="hud">
          <div class="badge">
            <div class="dot" id="liveDot"></div>
            <span id="statusText">Cámara apagada</span>
          </div>
          <div class="badge flip-btn" id="flipBtn">
            <span id="flipIcon"></span><span id="facingLabel">Frontal</span>
          </div>
        </div>
        <div class="target-chip"><div class="badge" id="targetBadge">0/0</div></div>
        <div class="orientation-row">
          <div class="badge" id="orientationBadge" style="display: none">
            <span id="orientationIcon"></span><span id="orientationText">Vertical</span>
          </div>
        </div>
        <div class="checklist-hud" id="checklistHud" style="display: none">
          <div class="cl-title" id="clTitle">Cuerpo <span id="clCount">0/0</span></div>
          <div id="clRows"></div>
        </div>
        <div class="rep-hud">
          <div class="rep-count" id="repCount">0</div>
        </div>
        <div class="gesture-hud" id="gestureHud">
          <p class="gesture-text" id="gestureText">Sostené la mano sobre INICIAR para empezar</p>
        </div>
        <div class="countdown-overlay" id="countdownOverlay">5</div>
        <div class="cadence-hud" id="cadenceHud">6</div>
        <div class="voice-badge" id="voiceBadge" style="display: none"></div>
        <div class="action-row" id="actionRow">
          <div class="dwell-btn exit" id="exitBtn">
            <span class="dwell-ring" id="exitRing"></span><span>SALIR</span>
          </div>
          <div class="dwell-btn next" id="nextBtn">
            <span class="dwell-ring" id="nextRing"></span><span id="nextLabel">SIGUIENTE</span>
          </div>
          <div class="dwell-btn repeat" id="repeatBtn">
            <span class="dwell-ring" id="repeatRing"></span><span id="actionLabel">INICIAR</span>
          </div>
        </div>
        <div class="liveness-overlay" id="livenessOverlay">
          <div class="lv-line">SEÑAL</div>
          <div class="lv-line">DE</div>
          <div class="lv-line">VIDA</div>
          <p class="lv-instruct" id="livenessInstruct"></p>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        PoseLandmarker,
        FilesetResolver,
        DrawingUtils,
      } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

      const qs = new URLSearchParams(location.search);
      // Rutina (modo libre con varios ejercicios): `seq=id:objetivo,id:objetivo,...`.
      // Sin `seq` queda el ejercicio único (`exercise` + `target`), como antes.
      const readTarget = (raw, fallback) => {
        const n = parseInt(raw, 10);
        return Number.isFinite(n) && n > 0 ? n : fallback;
      };
      const SEQ = (qs.get('seq') || '')
        .split(',')
        .map((part) => {
          const i = part.indexOf(':');
          const id = (i > -1 ? part.slice(0, i) : part).trim();
          const t = i > -1 ? part.slice(i + 1) : '';
          return { id, target: readTarget(t, 10) };
        })
        .filter((s) => s.id);
      if (!SEQ.length) {
        SEQ.push({
          id: qs.get('exercise') || 'sentadillas',
          target: readTarget(qs.get('target'), 10),
        });
      }
      const EX_ID = SEQ[0].id;
      const MODE_RANKED = qs.get('ranked') === '1';
      // Sesión validada para ranking (libre rankeado o reto diario con
      // `liveness=1`): EXIGE la prueba de vida para acreditar el resultado. La
      // vida se pide durante la serie (temporizador) o, si la serie termina
      // antes, al finalizarla (fallback) — nunca se envía sin haberla hecho.
      const LIVENESS_REQUIRED = MODE_RANKED || qs.get('liveness') === '1';
      const CADENCE_SEC = Math.min(15, Math.max(2, parseInt(qs.get('cadence') || '6', 10)));
      const CADENCE_MS = CADENCE_SEC * 1000;
      const VERIFY_VERSION = Number.isFinite(parseInt(qs.get('v') || '1', 10))
        ? Math.max(1, parseInt(qs.get('v') || '1', 10))
        : 1;

      const video = document.getElementById('video');
      const canvas = document.getElementById('overlay');
      const ctx = canvas.getContext('2d');
      const startBtn = { disabled: false, textContent: '', style: {}, onclick: null };
      const stopBtn = { style: {}, onclick: null };
      const repCountEl = document.getElementById('repCount');
      const stateMsg = { style: {}, className: '', textContent: '' };
      const statusText = document.getElementById('statusText');
      const liveDot = document.getElementById('liveDot');
      const logEl = { textContent: '' };
      const targetBadge = document.getElementById('targetBadge');
      const checklistHud = document.getElementById('checklistHud');
      const clTitle = document.getElementById('clTitle');
      const clRows = document.getElementById('clRows');
      const stubClassList = { add() {}, remove() {}, toggle() {} };
      const stubTagEl = { classList: stubClassList };
      const resultCard = { classList: stubClassList, querySelector: () => stubTagEl };
      const resultReps = { textContent: '' };
      const resultDetail = { textContent: '' };
      const verifyText = { textContent: '' };
      const flipBtn = document.getElementById('flipBtn');
      const flipIcon = document.getElementById('flipIcon');
      const facingLabel = document.getElementById('facingLabel');
      const orientationBadge = document.getElementById('orientationBadge');
      const orientationIcon = document.getElementById('orientationIcon');
      const orientationText = document.getElementById('orientationText');
      const gestureHud = document.getElementById('gestureHud');
      const gestureText = document.getElementById('gestureText');
      const countdownOverlay = document.getElementById('countdownOverlay');
      const cadenceHud = document.getElementById('cadenceHud');
      const voiceBadge = document.getElementById('voiceBadge');
      const livenessOverlay = document.getElementById('livenessOverlay');
      const livenessInstruct = document.getElementById('livenessInstruct');
      const videoWrap = document.querySelector('.video-wrap');
      const exitBtn = document.getElementById('exitBtn');
      const exitRing = document.getElementById('exitRing');
      const repeatBtn = document.getElementById('repeatBtn');
      const repeatRing = document.getElementById('repeatRing');
      const actionLabel = document.getElementById('actionLabel');
      const nextBtn = document.getElementById('nextBtn');
      const nextRing = document.getElementById('nextRing');
      const nextLabel = document.getElementById('nextLabel');
      const actionRow = document.getElementById('actionRow');

      const NAME = {
        sentadillas: 'Sentadillas',
        flexiones: 'Flexiones',
        abdominales: 'Abdominales',
        plancha: 'Plancha',
        zancadas: 'Zancadas',
        puente_gluteo: 'Puente de glúteo',
        mountain_climbers: 'Mountain Climbers',
        sentadilla_isometrica: 'Sentadilla isométrica',
        fondos_silla: 'Fondos en silla',
      };
      document.title = NAME[EX_ID] || 'Verificación';

      const HOWTO = {
        sentadillas:
          'Parate derecho frente a la cámara con los pies al ancho de los hombros. Bajá llevando la cadera hacia atrás hasta que tus rodillas queden cerca de 90° y volvé a subir. Cada bajada y subida completa cuenta como 1.',
        flexiones:
          'Apoyá las manos a la altura de los hombros y estirá el cuerpo en plancha. Bajá el pecho doblando los codos hasta casi tocar el piso y volvé arriba empujando. Mantené el cuerpo recto todo el tiempo.',
        abdominales:
          'Recostate boca arriba con las rodillas flexionadas y los pies apoyados. Llevá el pecho hacia las rodillas contrayendo el abdomen y volvé a apoyar la espalda. Cada subida completa cuenta como 1.',
        plancha:
          'Pará en plancha con los brazos extendidos y el cuerpo formando una línea recta de la cabeza a los pies. Mantené la posición sin bajar la cadera hasta completar el tiempo.',
        zancadas:
          'Parate derecho mirando a la cámara. Da un paso largo hacia adelante y bajá hasta que ambas rodillas queden cerca de 90°. Volvé a la posición inicial y repetí con la otra pierna.',
        puente_gluteo:
          'Recostate boca arriba con las rodillas flexionadas y los pies apoyados. Elevá la cadera apretando los glúteos, mantené un segundo y bajá hasta apoyarla. Cada subida cuenta como 1.',
        mountain_climbers:
          'Ponete en plancha apoyando las manos. Llevá una rodilla rápido al pecho y volvé, alternando las piernas en ritmo continuo. Cada rodilla al pecho cuenta como 1.',
        sentadilla_isometrica:
          'Parate derecho y bajá a una sentadilla hasta que tus rodillas queden cerca de 90°. Mantené la posición sin subir hasta completar el tiempo.',
        fondos_silla:
          'Ponete de perfil a la cámara sentado al borde de una silla, con las manos apoyadas en el borde por detrás y las piernas extendidas hacia adelante. Bajá la cadera flexionando los codos y volvé a subir empujando con los brazos: mantené las piernas extendidas, no te ayudés con las piernas. Cada fondo cuenta como 1.',
      };

      const ICON = {
        flip: `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>`,
        device: `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>`,
        warning: `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
        check: `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
      };
      flipIcon.innerHTML = ICON.flip;
      orientationIcon.innerHTML = ICON.device;

      const LID = {
        nose: 0,
        left_eye: 2,
        right_eye: 5,
        left_shoulder: 11,
        right_shoulder: 12,
        left_elbow: 13,
        right_elbow: 14,
        left_wrist: 15,
        right_wrist: 16,
        left_pinky: 17,
        right_pinky: 18,
        left_index: 19,
        right_index: 20,
        left_thumb: 21,
        right_thumb: 22,
        left_hip: 23,
        right_hip: 24,
        left_knee: 25,
        right_knee: 26,
        left_ankle: 27,

        lastBeeped = -1;
        cadenceDeadline = 0;
        cadenceHud.style.display = 'none';
        gestureHud.style.display = 'none';
        countdownOverlay.style.display = 'none';
        completed = false;
        hideActionButton();
        hideLiveness();
        livenessChallengeActive = false;
        livenessPassed = false;
        livenessNextTriggerAt = null;
        livenessConfirmFrames = 0;
        livenessHoldStartTime = null;
        pendingCompletionDetail = null;
        repCountEl.textContent = '0';
        refreshHud();
        resultCard.classList.remove('show');
        // Cada serie consume como mínimo una frase de cada puesto, así que al
        // cargar el ejercicio se reabren los cinco.
        Object.keys(VOICE_SLOT_OFFSET).forEach(function (slot) {
          voiceFired[slot] = false;
        });
        if (voiceBadge) voiceBadge.style.display = 'none';
      }

      // ---------------------------------------------------------------------
      // Voz del entrenador
      //
      // No hay modelo acá: son 40 frases escritas, repartidas en 5 puestos
      // (pre / mid / last / done / rest) con 8 frases cada uno. Cada serie
      // consume como máximo una frase de cada puesto, así que la siguiente
      // sesión arranca en el grupo siguiente y las 40 dan una vuelta completa.
      //
      // El índice sale de `voiceRound`, no de un cursor propio: no hay estado
      // que se desincronice si un puesto no dispara (por ejemplo `mid`, que en
      // ranking está desactivado).
      //
      // Dos reglas que no son negociables:
      //  - Los números los pone el código, nunca la frase. La única con cuenta
      //    es `last`, y solo dispara cuando faltan exactamente 3.
      //  - En isométricos (unit 'seconds') no se habla dentro de la serie: la
      //    fonación no deja vaciar los pulmones y rompe el braceo que sostiene
      //    la columna. Por eso `mid` y `last` solo aplican a 'reps'.
      // ---------------------------------------------------------------------
      const VOICE_MIN_GAP_MS = 2500;
      const VOICE_MID_MIN_TARGET = 10;
      const VOICE_SLOT_OFFSET = { pre: 0, mid: 3, last: 6, done: 1, rest: 4 };
      const VOICE_INSIDE_SET = { pre: false, mid: true, last: true, done: false, rest: false };
      const VOICE_UNITS = {
        pre: ['reps', 'seconds'],
        mid: ['reps'],
        last: ['reps'],
        done: ['reps', 'seconds'],
        rest: ['reps', 'seconds'],
      };
      const VOICE_CORPUS = {
        pre: [
          'Prepará la postura. Cuando quieras, arrancá.',
          'Acomodate bien. Esta serie va con control.',
          'Todo listo. Empezá cuando te sientas cómodo.',
          'Buscá un ritmo que puedas sostener.',
          'Mirá fijo al frente. Arrancá.',
          'Controlá la respiración. Empezá.',
          'Esta serie va a tu ritmo, sin apurarte.',
          'Vamos con esta. Prestá atención a la técnica.',
        ],
        mid: [
          'Vas por la mitad. Seguí así.',
          'Buen ritmo. Mantenelo.',
          'Mirá la técnica, no el número.',
          'Aguantá bien. Viene más.',
          'Sin apuro. El control es lo que suma.',
          'Eso. Mismo ritmo.',
          'Vamos bien. No aflojes ahora.',
          'Seguí con la misma intensidad.',
        ],
        last: [
          'Últimas tres. Vamos.',
          'Faltan tres. Aguantá.',
          'Últimas tres: la más técnica.',
          'Quedan tres. Sostené el ritmo.',
          'Faltan tres. Dá.',
          'Últimas tres. No aflojes.',
          'Tres más. Con ritmo.',
          'Faltan tres. Cerrá fuerte.',
        ],
        done: [
          'Listo. Buen trabajo.',
          'Serie completa. Recuperate.',
          'Terminaste. Buen ritmo.',
          'Bien. Descansá un momento.',
          'Completaste la serie.',
          'Esa fue. Tomá agua.',
          'Listo, esa serie quedó.',
          'Completaste. Ahora descansá.',
        ],
        rest: [
          'Acomodate y respirá.',
          'Tiempo de descanso. Respirá bien.',
          'Sostené la respiración un momento.',
          'Frená acá y tomá aire.',
          'Descansá. Respirá lento.',
          'Ahora es para recuperar.',
          'Sostenete. Tomá aire.',
          'Descansá bien antes de seguir.',
        ],
      };
      const voiceFired = {};
      let voiceLastAt = -1e9;
      // La app corre una serie por sesión (no hay secuencia en la página,
      // como en el banco): `voiceRound` lleva la rotación de frases entre
      // series y cumple el papel que `seqDone` cumple en el banco.
      let voiceRound = 0;

      function voiceInsideSetOk() {
        // En ranking la cadencia de 6 s se mide entre reps. Si la voz entra en
        // la serie, el usuario la escucha y la pausa siguiente puede romper el
        // ranking solo por hablarle. Ranking manda: silencio.
        return !MODE_RANKED;
      }
      function voiceLine(slot) {
        const pool = VOICE_CORPUS[slot];
        if (!pool || !pool.length) return '';
        const units = VOICE_UNITS[slot] || [];
        if (units.indexOf(targetUnit) === -1) return '';
        if (VOICE_INSIDE_SET[slot] && !voiceInsideSetOk()) return '';
        const i = (Math.max(0, voiceRound) + VOICE_SLOT_OFFSET[slot]) % pool.length;
        return pool[i];
      }
      // Devuelve la frase y la marca como gastada. No habla: el llamador
      // compone la frase con su mensaje para no cortar la locución.
      function voiceTake(slot) {
        if (voiceFired[slot]) return '';
        voiceFired[slot] = true;
        if (performance.now() - voiceLastAt < VOICE_MIN_GAP_MS) return '';
        const line = voiceLine(slot);
        if (!line) return '';
        voiceLastAt = performance.now();
        return line;
      }
      function voiceFlash(text) {
        // log para RN
        if (typeof window.ReactNativeWebView !== 'undefined') {
          try {
            window.ReactNativeWebView.postMessage(
              JSON.stringify({ type: 'voz_log', text: 'VOZ: ' + text }),
            );
          } catch (e) {}
        }
        if (voiceBadge) {
          voiceBadge.style.display = 'block';
          voiceBadge.textContent = text;
        }
        log('VOZ: ' + text);
      }
      function voiceSay(slot) {
        const text = voiceTake(slot);
        if (!text) return '';
        speak(text);
        voiceFlash(text);
        return text;
      }

      function announceSession() {
        if (!sessionStartTime) {
          sessionStartTime = performance.now();
          // La frase de arranque reemplaza al texto fijo: `speak()` cancela lo
          // anterior, así que hablar las dos cosas sonaba a arranque cortado.
          speak(voiceSay('pre') || 'Empezá cuando quieras');
        }
      }

      function registerRep() {
        const now = performance.now();
        if (targetUnit === 'reps') {
          if (!gestureStarted) return;
          if (MODE_RANKED && now > cadenceDeadline) {
            failSeries('Descanso muy largo — fuera de ranking');
            return;
          }
        }
        repCount++;
        repTimestamps.push(now);
        // Al completar la repe LIVENESS_MIN_REP se arma la vida aleatoria (con
        // meta > 10). Antes de eso no puede aparecer.
        if (targetUnit === 'reps' && repCount === LIVENESS_MIN_REP) scheduleLiveness();
        repCountEl.textContent = repCount;
        repCountEl.style.transform = 'scale(1.15)';
        setTimeout(() => (repCountEl.style.transform = 'scale(1)'), 150);
        playRep();
        refreshHud();
        if (targetUnit === 'reps') beginCadence(now);
        // Voz: los números salen de acá, no de la frase. `last` dispara
        // exactamente cuando faltan 3, así que la cuenta nunca se desincroniza.
        if (targetUnit === 'reps') {
          if (targetVal >= VOICE_MID_MIN_TARGET && repCount >= Math.ceil(targetVal / 2))
            voiceSay('mid');
          if (repCount === targetVal - 3) voiceSay('last');
        }
        if (targetUnit === 'reps' && repCount >= targetVal) {
          postComplete('Meta cumplida: ' + repCount);
        }
      }
      function currentValue() {
        return targetUnit === 'reps' ? repCount : Math.floor(holdMs / 1000);
      }
      function completePayload(detail) {
        const value = currentValue();
        const startedAt = sessionStartTime ? Math.trunc(sessionStartTime) : 0;
        const finishedAt = Math.trunc(performance.now());
        const durationMs = startedAt > 0 ? Math.max(0, finishedAt - startedAt) : 0;
        return {
          exerciseId: SEQ[seqIndex].id,
          seqIndex,
          seqLength: SEQ.length,
          target: targetVal,
          reps: value,
          detail,
          ranked: MODE_RANKED,
          seriesOk: MODE_RANKED && seriesOk,
          livenessOk: MODE_RANKED && (livenessPassed || !livenessEnabled),
          cadence: MODE_RANKED && targetUnit === 'reps' ? CADENCE_SEC : 0,
          unit: cfg.unit,
          value,
          evidence: {
            verifyVersion: VERIFY_VERSION,
            model: 'mediapipe_pose',
            startedAt,
            finishedAt,
            durationMs,
            cadenceSec: MODE_RANKED && targetUnit === 'reps' ? CADENCE_SEC : 0,
            livenessRequired: !!livenessEnabled,
            livenessPassed: livenessEnabled ? !!livenessPassed : undefined,
            targetVal,
            targetMet: value >= targetVal,
          },
        };
      }
      function qualifiedNow() {
        return (
          MODE_RANKED &&
          gestureStarted &&
          seriesOk &&
          currentValue() >= targetVal &&
          (livenessPassed || !livenessEnabled)
        );
      }
      function postComplete(detail, voiceLead) {
        // Si ya hay un resultado esperando la prueba de vida, no se reenvía (la
        // serie de segundos vuelve a llamar acá en cada cuadro mientras sostiene).
        if (pendingCompletionDetail != null) return;
        // Vida garantizada: la serie cumplió la meta y todavía no hay prueba de
        // vida. Con meta de repes ≤ 10 ESTE es el camino normal (la vida se pide
        // al final); con > 10 es el respaldo si la serie terminó antes de que
        // saliera el temporizador. Se envía recién al confirmarla.
        if (livenessEnabled && !livenessPassed && currentValue() >= targetVal) {
          pendingCompletionDetail = detail;
          livenessChallengeActive = false;
          livenessNextTriggerAt = performance.now();
          log('Prueba de vida pendiente: se pide antes de enviar el resultado');
          return;
        }
        // `done` se toma antes de avanzar `voiceRound`: el índice de grupo es
        // `voiceRound`, así que si se hablara después usaría el grupo siguiente
        // y la rotación se desalinearía una frase por serie.
        const done = voiceTake('done');
        const withDone = (msg) => (done && msg ? done + ' ' + msg : msg || done);
        // `voiceLead` (p. ej. "Serie completa") se antepone a la locución final
        // en una sola frase para que el TTS no corte lo anterior. Si la frase
        // elegida ya empieza con el lead (el corpus `done` tiene "Serie
        // completa. Recuperate."), no se duplica.
        const lead = (msg) => {
          if (!voiceLead) return msg;
          if (msg && msg.toLowerCase().indexOf(voiceLead.toLowerCase()) === 0) return msg;
          return msg ? voiceLead + '. ' + msg : voiceLead;
        };
        const nextEntry = seqIndex + 1 < SEQ.length ? SEQ[seqIndex + 1] : null;
        if (done) voiceFlash(done);
        if (nextEntry) {
          const nextName = NAME[nextEntry.id] || nextEntry.id;
          const nextUnitName =
            (CFG[nextEntry.id] || CFG.sentadillas).unit === 'seconds' ? ' segundos' : ' reps';
          nextHintText =
            'Cuando estés listo, mantené tu mano sobre SIGUIENTE para empezar ' + nextName;
          speak(
            lead(
              'Meta cumplida. Siguiente: ' +
                nextName +
                '. Meta ' +
                nextEntry.target +
                nextUnitName +
                '. Sostené tu mano sobre SIGUIENTE para empezar',
            ),
          );
        } else {
          speak(lead(withDone('')));
        }
        voiceRound++;
        seqDone++;
        seqFinished = !nextEntry;
        // La serie terminó, pero NO apagamos la cámara: dejamos el loop vivo
        // para detectar el gesto sobre REPETIR / SALIR. `completed` hace que
        // gestos y conteo de reps queden en pausa en el loop.
        completed = true;
        hideLiveness();
        cadenceHud.style.display = 'none';
        gestureHud.style.display = 'none';
        countdownOverlay.style.display = 'none';
        stateMsg.style.display = 'none';
        checklistHud.style.display = 'none';
        stopBtn.style.display = 'none';
        startBtn.style.display = 'none';
        statusText.textContent = 'Serie completa';
        showActionButton('REPETIR', 'repeat');
        if (nextEntry) showNextButton();
        resultReps.textContent = repCount + (targetUnit === 'seconds' ? 's' : '');
        resultCard.classList.add('show');
        verifyText.textContent = MODE_RANKED
          ? qualifiedNow()
            ? 'Sesión enviada para validación — pendiente de ranking'
            : 'No califica para ranking'
          : 'Verificado por pose';
        post('complete', completePayload(detail || 'Completado'));
        log(detail || 'Completado');
      }

      // ---------- botones con la mano (INICIAR / REPETIR / SALIR) ----------
      // El landmark viene en coords normalizadas del frame de la cámara. Hay
      // que reproducir el mapeo visual: cover (recorte centrado) + espejo CSS
      // (scaleX(-1) cuando la cámara es frontal).
      function landmarkToWrap(p) {
        const W = videoWrap.clientWidth || 1;
        const H = videoWrap.clientHeight || 1;
        const vw = video.videoWidth || W;
        const vh = video.videoHeight || H;
        const scale = Math.max(W / vw, H / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        let x = (W - dw) / 2 + p.x * dw;
        const y = (H - dh) / 2 + p.y * dh;
        if (currentFacing === 'user') x = W - x;
        return { x, y };
      }
      function wristOver(btn, pose) {
        if (!pose || !pose.landmarks || !pose.landmarks.length) return false;
        const lm = pose.landmarks[0];
        const r = btn.getBoundingClientRect();
        const w = videoWrap.getBoundingClientRect();
        const left = r.left - w.left;
        const top = r.top - w.top;
        for (const idx of [LID.left_wrist, LID.right_wrist]) {
          const p = lm[idx];
          if (!p || (p.visibility ?? 1) < 0.3) continue;
          const s = landmarkToWrap(p);
          if (s.x >= left && s.x <= left + r.width && s.y >= top && s.y <= top + r.height)
            return true;
        }
        return false;
      }
      function dwellStep(id, btn, ring, pose, action) {
        const now = performance.now();
        if (!btn || btn.style.display === 'none') {
          dwellStart[id] = 0;
          if (ring) ring.style.setProperty('--p', '0');
          return;
        }
        // Los botones solo se pueden usar si TODOS los checks del cuerpo están
        // en verde (cuerpo completo visible). Si falta algo, no cargan.
        if (!bodyComplete) {
          dwellStart[id] = 0;
          if (ring) ring.style.setProperty('--p', '0');
          return;
        }
        if (!wristOver(btn, pose)) {
          dwellStart[id] = 0;
          if (ring) ring.style.setProperty('--p', '0');
          return;
        }
        if (!dwellStart[id]) dwellStart[id] = now;
        const ratio = Math.min(1, (now - dwellStart[id]) / DWELL_MS);
        if (ring) ring.style.setProperty('--p', String(Math.round(ratio * 100)));
        if (ratio >= 1) {
          dwellStart[id] = 0;
          if (ring) ring.style.setProperty('--p', '0');
          action();
        }
      }
      function bodyHint() {
        if (bodyHintSpoken) return;
        bodyHintSpoken = true;
        const label = nextMode ? 'SIGUIENTE' : actionMode ? actionLabel.textContent : 'INICIAR';
        speak('Todo tu cuerpo debe verse en cámara, sostené la mano sobre ' + label);
      }
      function bodyHintReset() {
        bodyHintSpoken = false;
      }
      function dwellTick(pose) {
        if (!bodyComplete) {
          // Cuerpo incompleto: los botones no responden. Si intenta usarlos con
          // la mano, la IA le recuerda que debe verse todo el cuerpo.
          dwellStep('exit', exitBtn, exitRing, pose, exitSession);
          if (actionMode) dwellStep('action', repeatBtn, repeatRing, pose, actionFire);
          if (nextMode) dwellStep('next', nextBtn, nextRing, pose, nextFire);
          if (
            pose &&
            !waitingGesture &&
            (wristOver(exitBtn, pose) ||
              (actionMode && wristOver(repeatBtn, pose)) ||
              (nextMode && wristOver(nextBtn, pose)))
          )
            bodyHint();
          return;
        }
        bodyHintReset();
        dwellStep('exit', exitBtn, exitRing, pose, exitSession);
        if (nextMode) {
          // Tras mostrarse el botón hay que sacar la mano una vez antes de que
          // cuente el dwell: evita que dispare solo si la mano ya venía encima.
          if (!wristOver(nextBtn, pose)) nextArmed = true;
          if (nextArmed) dwellStep('next', nextBtn, nextRing, pose, nextFire);
          else nextRing.style.setProperty('--p', '0');
          // Hint hablado la primera vez que apoya la mano sobre SIGUIENTE.
          if (wristOver(nextBtn, pose) && !nextHintSpoken) {
            nextHintSpoken = true;
            speak(nextHintText);
          }
        }
        if (actionMode) {
          if (!wristOver(repeatBtn, pose)) actionArmed = true;
          if (actionArmed) dwellStep('action', repeatBtn, repeatRing, pose, actionFire);
          else repeatRing.style.setProperty('--p', '0');
        }
      }
      function showExitButton() {
        exitBtn.style.display = 'flex';
      }
      function hideExitButton() {
        exitBtn.style.display = 'none';
      }
      function showActionButton(label, mode) {
        hidePostureIndicator();
        actionLabel.textContent = label;
        actionMode = mode;
        actionArmed = false;
        repeatBtn.style.display = 'flex';
      }
      function hideActionButton() {
        hidePostureIndicator();
        hideNextButton();
        repeatBtn.style.display = 'none';
        actionMode = null;
        repeatRing.style.setProperty('--p', '0');
      }
      function showNextButton() {
        nextMode = 'next';
        nextArmed = false;
        nextHintSpoken = false;
        nextBtn.style.display = 'flex';
        actionRow.classList.add('trio');
      }
      function hideNextButton() {
        nextMode = null;
        nextArmed = false;
        nextBtn.style.display = 'none';
        actionRow.classList.remove('trio');
        nextRing.style.setProperty('--p', '0');
      }
      function nextFire() {
        if (nextMode === 'next') nextSeries();
      }
      function showPostureIndicator() {
        postureMode = true;
        postureShown = null;
        actionMode = null;
        actionArmed = false;
        repeatRing.style.setProperty('--p', '0');
        repeatBtn.classList.add('posture');
        repeatBtn.classList.remove('posture-falta');
        setPostureIndicator(false);
        repeatBtn.style.display = 'flex';
      }
      function setPostureIndicator(correct) {
        if (postureShown === correct) return;
        postureShown = correct;
        actionLabel.textContent = correct ? 'Correcto' : 'Falta';
        repeatBtn.classList.toggle('posture-falta', !correct);
      }
      function hidePostureIndicator() {
        postureMode = false;
        postureShown = null;
        repeatBtn.classList.remove('posture', 'posture-falta');
      }
      function actionFire() {
        if (actionMode === 'start') startNow();
        else if (actionMode === 'repeat') repeatSeries();
      }
      function exitSession() {
        completed = false;
        hideExitButton();
        hideActionButton();
        running = false;
        const s = video.srcObject;
        if (s) s.getTracks().forEach((t) => t.stop());
        liveDot.classList.remove('live');
        statusText.textContent = 'Sesión cancelada';
        post('exit', {});
        log('Sesión cancelada por el usuario');
      }
      function repeatSeries() {
        completed = false;
        hideActionButton();
        resetRepState();
        applyMirror();
        post('repeat', {});
        beginReadyCount(performance.now());
        log('Serie repetida por el usuario');
      }
      // Carga un ejercicio de la rutina (`seq`): actualiza configuración y
      // objetivo y deja todo listo para la próxima serie.
      function loadExercise(i) {
        seqIndex = i;
        seqDone = 0;
        seqFinished = i + 1 >= SEQ.length;
        cfg = CFG[SEQ[i].id] || CFG.sentadillas;
        targetUnit = cfg.unit;
        targetVal = SEQ[i].target;
        livenessEnabled = LIVENESS_REQUIRED || targetUnit === 'seconds' || targetVal > 5;
        livenessEndOnly = targetUnit === 'reps' && targetVal <= 10;
        document.title = NAME[SEQ[i].id] || 'Verificación';
        completed = false;
        postureMode = false;
        postureShown = null;
        hideNextButton();
        resetRepState();
      }
      function nextSeries() {
        if (seqIndex + 1 >= SEQ.length) return;
        hideNextButton();
        const next = seqIndex + 1;
        loadExercise(next);
        post('exercise', { index: next, exerciseId: SEQ[next].id, target: SEQ[next].target });
        beginReadyCount(performance.now());
        log('Siguiente: ' + (NAME[SEQ[next].id] || SEQ[next].id));
      }

      // Espera previa a la serie: el inicio ya no es "levantá la mano" sino
      // sostener la mano sobre el botón INICIAR (mismo dwell de los botones).
      function awaitStart() {
        waitingGesture = true;
        gestureHud.style.display = 'block';
        gestureText.textContent = '';
        showActionButton('INICIAR', 'start');
      }
      function startNow() {
        if (!bodyComplete) {
          speak('Todo tu cuerpo debe verse en cámara, sostené la mano sobre INICIAR');
          return;
        }
        waitingGesture = false;
        hideActionButton();
        beginReadyCount(performance.now());
      }
      function awaitStartTick(pose) {
        if (!waitingGesture) return;
        const msg =
          pose && bodyComplete
            ? 'Sostené la mano sobre INICIAR para empezar'
            : 'Todo tu cuerpo debe verse en cámara, sostené la mano sobre INICIAR';
        if (gestureText.textContent !== msg) {
          gestureText.textContent = msg;
          speak(msg);
        }
      }
      function beginReadyCount(now) {
        readyCountStart = now;
        readyCountEnd = now + 5000;
        lastBeeped = -1;
        gestureHud.style.display = 'none';
        countdownOverlay.style.display = 'flex';
        countdownOverlay.textContent = '5';
        if (targetUnit === 'reps') showPostureIndicator();
        beep({ freq: 1100, dur: 0.09, gain: 0.8 });
      }
      function readyTick(now) {
        if (!readyCountEnd) return;
        if (now >= readyCountEnd) {
          readyCountEnd = 0;
          countdownOverlay.style.display = 'none';
          gestureStarted = true;
          speak('¡Ya!');
          if (targetUnit === 'reps') beginCadence(now);
          return;
        }
        const sec = Math.ceil((readyCountEnd - now) / 1000);
        countdownOverlay.textContent = String(sec || 0);
        if (sec !== lastBeeped) {
          lastBeeped = sec;
          beep({ freq: 1100, dur: 0.09, gain: 0.8 });
        }
      }
      function beginCadence(now) {
        cadenceDeadline = now + CADENCE_MS;
        cadenceHud.style.display = 'flex';
        cadenceHud.textContent = String(CADENCE_SEC);
        cadenceHud.classList.remove('urgent');
      }
      function cadenceTick(now) {
        if (targetUnit !== 'reps' || !seriesOk) return;
        if (MODE_RANKED && !gestureStarted) return;
        if (!cadenceDeadline) return;
        if (now > cadenceDeadline) {
          if (MODE_RANKED) {
            failSeries('Descanso muy largo — fuera de ranking');
            return;
          }
          cadenceDeadline = 0;
          cadenceHud.style.display = 'none';
          return;
        }
        const rem = Math.max(0, Math.ceil((cadenceDeadline - now) / 1000));
        cadenceHud.textContent = String(rem);
        cadenceHud.classList.toggle('urgent', rem <= 2);
      }
      function failSeries(msg) {
        if (!seriesOk) return;
        seriesOk = false;
        cadenceHud.style.display = 'none';
        log('SERIE ROTA: ' + msg);
        speak('Descanso muy largo. La serie quedó fuera del ranking');
        stopCamera();
      }

      function evaluateTransition(cand) {
        if (cand && cand === candidateState) {
          candidateStreak++;
        } else {
          candidateState = cand;
          candidateStreak = cand ? 1 : 0;
        }
        if (!cand || candidateStreak < STATE_CONFIRM_FRAMES) return;
        if (!repStateInitialized) {
          if (cand === 'up') {
            repState = 'up';
            repStateInitialized = true;
            scheduleLiveness();
            announceSession();
          }
          return;
        }
        if (cand === 'down' && repState === 'up') {
          repState = 'down';
        } else if (cand === 'up' && repState === 'down') {
          repState = 'up';
          const now = performance.now();
          if (now - lastRepTime >= MIN_REP_INTERVAL_MS) {
            lastRepTime = now;
            registerRep();
          }
        }
      }
      function evaluateTransitionCalibrated(cand) {
        if (cand && cand === candidateState) {
          candidateStreak++;
        } else {
          candidateState = cand;
          candidateStreak = cand ? 1 : 0;
        }
        if (!cand || candidateStreak < STATE_CONFIRM_FRAMES) return;
        if (cand === 'down' && repState === 'up') {
          repState = 'down';
        } else if (cand === 'up' && repState === 'down') {
          repState = 'up';
          const now = performance.now();
          if (now - lastRepTime >= MIN_REP_INTERVAL_MS) {
            lastRepTime = now;
            registerRep();
          }
        }
      }

      // ---------- procesar pose ----------
      function processPose(result) {
        bodyComplete = false;
        if (orientationSupported && !deviceIsVertical) {
          bodyOkStreak = 0;
          candidateState = null;
          candidateStreak = 0;
          repStateInitialized = false;
          calibBuffer = [];
          dynamicDownThresh = null;
          dynamicUpThresh = null;
          checklistHud.style.display = 'none';
          stateMsg.style.display = 'block';
          stateMsg.className = 'state-msg blocked';
          stateMsg.textContent = 'Poné el celular parado en vertical';
          return;
        }
        if (!result.landmarks || !result.landmarks.length) {
          bodyOkStreak = 0;
          sideVotes = [];
          confirmedSide = null;
          candidateState = null;
          candidateStreak = 0;
          repStateInitialized = false;
          calibBuffer = [];
          dynamicDownThresh = null;
          dynamicUpThresh = null;
          checklistHud.style.display = 'none';
          stateMsg.style.display = 'block';
          stateMsg.className = 'state-msg nobody';
          stateMsg.textContent = 'No se detecta cuerpo — pausado';
          if (targetUnit === 'seconds') {
            if (lastHoldOk) holdMs = 0;
            lastHoldOk = false;
          }
          hideLiveness();
          livenessChallengeActive = false;
          return;
        }
        const lm = result.landmarks[0];
        // Prueba de vida (mano): se evalúa ACÁ, antes de cualquier gate de
        // postura. La señal de vida es una prueba independiente del ejercicio y
        // no debe quedar bloqueada por los anti-trampa (p. ej. fondos en silla
        // exige rodilla extendida; abdominales, no estar de pie). Antes vivía
        // dentro de processFrontal/processLateral, después de esos gates, así
        // que cualquier desvío de postura dejaba la mano ignorada para siempre.
        if (cfg.liveness === 'hand' && checkHandLiveness(lm)) return;
        if (cfg.type === 'frontal') return processFrontal(lm);
        return processLateral(lm);
      }

      function showState(cl, msg) {
        stateMsg.style.display = 'block';
        stateMsg.className = cl;
        stateMsg.textContent = msg;
      }

      function processFrontal(lm) {
        const { complete, missing } = checkComplete(lm, FRONTAL_POINTS);
        bodyComplete = complete;
        bodyMissing = complete ? [] : missing;
        renderChecklist('Cuerpo', FRONTAL_POINTS, missing);
        if (!complete) {
          bodyOkStreak = 0;
          [leftAngleHistory, rightAngleHistory] = [[], []];
          candidateState = null;
          candidateStreak = 0;
          repStateInitialized = false;
          calibBuffer = [];
          dynamicDownThresh = null;
          dynamicUpThresh = null;
          showState('state-msg blocked', 'Falta ver: ' + missing.map((m) => LABEL[m]).join(', '));
          return;
        }
        bodyOkStreak = Math.min(bodyOkStreak + 1, CONFIRM_FRAMES);
        if (bodyOkStreak < CONFIRM_FRAMES) {
          showState('state-msg blocked', 'Confirmando cuerpo…');
          return;
        }
        const la = angleBetween(lm[LID.left_hip], lm[LID.left_knee], lm[LID.left_ankle]);
        const ra = angleBetween(lm[LID.right_hip], lm[LID.right_knee], lm[LID.right_ankle]);
        if (la == null || ra == null) return;
        leftAngleHistory.push(la);
        if (leftAngleHistory.length > 5) leftAngleHistory.shift();
        rightAngleHistory.push(ra);
        if (rightAngleHistory.length > 5) rightAngleHistory.shift();
        const sl = leftAngleHistory.reduce((a, b) => a + b, 0) / leftAngleHistory.length;
        const sr = rightAngleHistory.reduce((a, b) => a + b, 0) / rightAngleHistory.length;
        const bothDown = cfg.downThresh
          ? Math.max(sl, sr) < cfg.downThresh
          : sl < dynamicDownThresh && sr < dynamicDownThresh;
        const bothUp = cfg.upThresh
          ? Math.min(sl, sr) > cfg.upThresh
          : sl > dynamicUpThresh && sr > dynamicUpThresh;
        const asymmetric = Math.abs(sl - sr) > 35;
        let cand = null;
        if (!(asymmetric && !(targetUnit === 'seconds' && bothDown))) {
          if (bothDown) cand = 'down';
          else if (bothUp) cand = 'up';
        }

        if (targetUnit === 'seconds') {
          // hold: cuenta tiempo en posición baja mantenida
          if (!repStateInitialized) {
            if (restSitGuard(lm)) {
              calibBuffer = [];
              showState('state-msg blocked', 'Quedate quieto para calibrar');
              return;
            }
            const ok = attemptCalibration(sl, cfg);
            if (ok) {
              repStateInitialized = true;
              scheduleLiveness();
              announceSession();
              showState('state-msg blocked', '¡Listo! Bajá y mantené');
            } else showState('state-msg blocked', 'Calibrando…');
            return;
          }
          const holdOk = cand === 'down';
          if (!gestureStarted) {
            showState(
              'state-msg blocked',
              'Levantá la mano arriba de la cabeza para empezar a contar',
            );
            return;
          }
          const now = performance.now();
          if (holdOk) {
            if (lastHoldOk === null) lastHoldOk = now;
            else ((holdMs += now - lastHoldOk), (lastHoldOk = now));
            if (holdMs / 1000 >= targetVal) {
              postComplete('Tiempo logrado: ' + Math.floor(holdMs / 1000) + 's');
            }
          } else lastHoldOk = null;
          repCountEl.textContent = Math.min(targetVal, Math.floor(holdMs / 1000));
          refreshHud();
          if (cand === 'down') showState('state-msg down', 'SOSTENÉ');
          else showState('state-msg blocked', 'Bajá y mantené');
          return;
        }

        evaluateTransition(cand);
        if (asymmetric && !bothDown) {
          candidateState = null;
          candidateStreak = 0;
          repStateInitialized = false;
          calibBuffer = [];
          dynamicDownThresh = null;
          dynamicUpThresh = null;
          showState('state-msg blocked', 'Movimiento asimétrico — usá ambos lados');
        } else if (!repStateInitialized)
          showState(
            'state-msg blocked',
            cand === 'up' ? 'Calibrando inicio…' : 'Parate derecho para calibrar',
          );
        else if (cand === 'down') showState('state-msg down', 'ABAJO');
        else if (cand === 'up') showState('state-msg up', 'ARRIBA');
      }

      function restSitGuard(lm) {
        // usados en laterales no-frontales; aquí no aplica (mantiene compatibilidad)
        return false;
      }

      function processLateral(lm) {
        const side = updateSide(lm, cfg);
        if (!side) {
          bodyComplete = false;
          bodyMissing = [];
          checklistHud.style.display = 'none';
          showState('state-msg blocked', 'Ubicá el celular de perfil');
          return;
        }
        const sc = cfg.sides[side];
        const mp = cfg.name === 'Mountain Climbers' ? sc.points : sc.points;
        const { complete, missing } = checkComplete(lm, mp);
        bodyComplete = complete;
        bodyMissing = complete ? [] : missing;
        renderChecklist(cfg.name, mp, missing);
        if (!complete) {
          bodyOkStreak = 0;
          angleHistory = [];
          kneeExtendHistory = [];
          candidateState = null;
          candidateStreak = 0;
          repStateInitialized = false;
          calibBuffer = [];
          dynamicDownThresh = null;
          dynamicUpThresh = null;
          showState('state-msg blocked', 'Falta ver: ' + missing.map((m) => LABEL[m]).join(', '));
          return;
        }
        bodyOkStreak = Math.min(bodyOkStreak + 1, CONFIRM_FRAMES);
        if (bodyOkStreak < CONFIRM_FRAMES) {
          showState('state-msg blocked', 'Confirmando lado…');
          return;
        }

        // postura real: apoyado en el piso
        if (cfg.groundedMax) {
          const hip = lm[LID[side + '_hip']],
            ankle = lm[LID[side + '_ankle']],
            shoulder = lm[LID[side + '_shoulder']];
          const ratio = groundedRatio(hip, ankle, shoulder);
          groundedHistory.push(ratio);
          if (groundedHistory.length > 5) groundedHistory.shift();
          const sr = groundedHistory.reduce((a, b) => a + b, 0) / groundedHistory.length;
          if (sr > cfg.groundedMax) {
            candidateState = null;
            candidateStreak = 0;
            repStateInitialized = false;
            calibBuffer = [];
            dynamicDownThresh = null;
            dynamicUpThresh = null;
            showState('state-msg blocked', cfg.postureMsg);
            return;
          }
        }
        // abdominales: gate anti-pararse. Si la rodilla queda muy por debajo
        // de la cadera mientras se cuenta (de pie), se bloquea y se pide
        // volver a acostarse. Portado del prototipo.
        if (cfg.standingKneeMargin) {
          const hip = lm[LID[side + '_hip']],
            knee = lm[LID[side + '_knee']],
            shoulder = lm[LID[side + '_shoulder']];
          const margin = kneeStandingMargin(hip, knee, shoulder);
          groundedHistory.push(margin);
          if (groundedHistory.length > 5) groundedHistory.shift();
          const sm = groundedHistory.reduce((a, b) => a + b, 0) / groundedHistory.length;
          if (sm > cfg.standingKneeMargin) {
            candidateState = null;
            candidateStreak = 0;
            repStateInitialized = false;
            calibBuffer = [];
            dynamicDownThresh = null;
            dynamicUpThresh = null;
            showState('state-msg blocked', cfg.postureMsg);
            return;
          }
        }
        // Anti-trampa de fondos en silla: si la rodilla se flexiona (agacharse
        // para ayudarse con las piernas en vez de empujar con los tríceps),
        // se bloquea. Las piernas deben quedar extendidas durante el fondo.
        if (cfg.kneeExtendMin) {
          const hip = lm[LID[side + '_hip']],
            knee = lm[LID[side + '_knee']],
            ankle = lm[LID[side + '_ankle']];
          const kneeAngle = angleBetween(hip, knee, ankle);
          if (kneeAngle != null) {
            kneeExtendHistory.push(kneeAngle);
            if (kneeExtendHistory.length > 5) kneeExtendHistory.shift();
            const ka = kneeExtendHistory.reduce((a, b) => a + b, 0) / kneeExtendHistory.length;
            if (ka < cfg.kneeExtendMin) {
              candidateState = null;
              candidateStreak = 0;
              repStateInitialized = false;
              calibBuffer = [];
              dynamicDownThresh = null;
              dynamicUpThresh = null;
              showState('state-msg blocked', cfg.kneeExtendMsg);
              return;
            }
          }
        }
        if (sc.line) {
          const A = lm[LID[sc.line.a]],
            B = lm[LID[sc.line.b]],
            C = lm[LID[sc.line.c]];
          const line = angleBetween(A, B, C);
          if (line != null) {
            lineAngleHistory.push(line);
            if (lineAngleHistory.length > 5) lineAngleHistory.shift();
            const sl = lineAngleHistory.reduce((a, b) => a + b, 0) / lineAngleHistory.length;
            if (cfg.lineMin && sl < cfg.lineMin) {
              candidateState = null;
              candidateStreak = 0;
              repStateInitialized = false;
              calibBuffer = [];
              dynamicDownThresh = null;
              dynamicUpThresh = null;
              showState('state-msg blocked', 'Alineá el cuerpo (cadera alta o hundida)');
              return;
            }
          }
        }
        // mountain climbers: conteo por pliegue de rodilla
        if (cfg.name === 'Mountain Climbers') {
          const ka = angleBetween(lm[LID[sc.knee.a]], lm[LID[sc.knee.b]], lm[LID[sc.knee.c]]);
          if (ka == null) return;
          angleHistory.push(ka);
          if (angleHistory.length > 5) angleHistory.shift();
          const sk = angleHistory.reduce((a, b) => a + b, 0) / angleHistory.length;
          if (!repStateInitialized) {
            if (!attemptCalibration(sk, { downDelta: 0, upDelta: 0 })) {
              showState('state-msg blocked', 'Entrá en plancha de perfil');
              return;
            }
            repStateInitialized = true;
            scheduleLiveness();
            announceSession();
            showState('state-msg blocked', '¡Listo! Arrancá');
            return;
          }
          const folded = sk < cfg.kneeFold;
          if (folded && repState !== 'fold') {
            repState = 'fold';
          } else if (!folded && repState === 'fold') {
            repState = 'up';
            const now = performance.now();
            if (now - lastRepTime >= MIN_REP_INTERVAL_MS) {
              lastRepTime = now;
              registerRep();
            }
          }
          showState(
            folded ? 'state-msg down' : 'state-msg up',
            folded ? 'RODILLA AL PECHO' : 'ARRIBA',
          );
          return;
        }

        const ang = angleBetween(lm[LID[sc.angle.a]], lm[LID[sc.angle.b]], lm[LID[sc.angle.c]]);
        if (ang == null) return;
        angleHistory.push(ang);
        if (angleHistory.length > 7) angleHistory.shift();
        const smoothed = angleHistory.reduce((a, b) => a + b, 0) / angleHistory.length;

        if (!repStateInitialized) {
          if (cfg.restTorsoMax) {
            const shoulder = lm[LID[side + '_shoulder']],
              hip = lm[LID[side + '_hip']];
            if (torsoHorizontalAngle(shoulder, hip) > cfg.restTorsoMax) {
              calibBuffer = [];
              showState('state-msg blocked', cfg.startMsg);
              return;
            }
          }
          const calibrated = attemptCalibration(smoothed, cfg);
          showState(
            'state-msg blocked',
            calibrated
              ? '¡Listo! Empezá cuando quieras'
              : cfg.startMsg + ' (quedate quieto un segundo)',
          );
          if (calibrated) {
            repState = 'up';
            repStateInitialized = true;
            scheduleLiveness();
            announceSession();
          }
          return;
        }

        if (cfg.liveness === 'hold' && checkHoldLiveness(smoothed, dynamicDownThresh)) return;

        if (targetUnit === 'seconds') {
          // hold: cuenta tiempo en posición válida (p. ej. plancha = brazos extendidos)
          if (!gestureStarted) {
            showState(
              'state-msg blocked',
              'Levantá la mano arriba de la cabeza para empezar a contar',
            );
            return;
          }
          const holdOk = smoothed > dynamicUpThresh;
          const now = performance.now();
          if (holdOk) {
            if (lastHoldOk === null) lastHoldOk = now;
            else ((holdMs += now - lastHoldOk), (lastHoldOk = now));
            if (holdMs / 1000 >= targetVal) {
              postComplete('Tiempo logrado: ' + Math.floor(holdMs / 1000) + 's');
            }
          } else lastHoldOk = null;
          repCountEl.textContent = Math.min(targetVal, Math.floor(holdMs / 1000));
          refreshHud();
          if (holdOk) showState('state-msg up', 'SOSTENÉ ' + Math.floor(holdMs / 1000) + 's');
          else showState('state-msg blocked', 'Fuera de posición');
          return;
        }

        let cand = null;
        if (cfg.bridge) {
          if (smoothed > dynamicDownThresh) cand = 'down';
          else if (smoothed < dynamicUpThresh) cand = 'up';
        } else {
          if (smoothed < dynamicDownThresh) cand = 'down';
          else if (smoothed > dynamicUpThresh) cand = 'up';
        }
        evaluateTransitionCalibrated(cand);
        const tag = ' (' + Math.round(smoothed) + '°)';
        if (cand === 'down') showState('state-msg down', 'ABAJO' + tag);
        else if (cand === 'up') showState('state-msg up', 'ARRIBA' + tag);
      }

      function draw(result) {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (result.landmarks && result.landmarks.length) {
          const du = new DrawingUtils(ctx);
          let pts = [];
          if (cfg.type === 'frontal') pts = FRONTAL_POINTS;
          else if (confirmedSide && cfg.sides[confirmedSide]) pts = cfg.sides[confirmedSide].points;
          for (const lm of result.landmarks) {
            du.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, {
              color: '#3A4552',
              lineWidth: 2,
            });
            for (const k of pts) {
              const p = lm[LID[k]];
              if (!p) continue;
              const ok = (p.visibility ?? 0) >= VIS;
              ctx.beginPath();
              ctx.arc(p.x * canvas.width, p.y * canvas.height, ok ? 5 : 6, 0, 2 * Math.PI);
              ctx.fillStyle = ok ? '#C8FF3D' : '#FF5A5A';
              ctx.fill();
              if (!ok) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#FF5A5A';
                ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, 10, 0, 2 * Math.PI);
                ctx.stroke();
              }
            }
          }
        }
        ctx.restore();
      }

      let currentFacing = 'user';
      function applyMirror() {
        const mirror = currentFacing === 'user';
        video.classList.toggle('no-mirror', !mirror);
        canvas.classList.toggle('no-mirror', !mirror);
      }
      flipBtn.onclick = async () => {
        currentFacing = currentFacing === 'user' ? 'environment' : 'user';
        facingLabel.textContent = currentFacing === 'user' ? 'Frontal' : 'Trasera';
        applyMirror();
        if (running) {
          const old = video.srcObject;
          if (old) old.getTracks().forEach((t) => t.stop());
          try {
            const ns = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: currentFacing },
              audio: false,
            });
            video.srcObject = ns;
            await video.play();
            log('Cámara cambiada');
          } catch (e) {
            log('No se pudo cambiar: ' + e.message);
          }
        }
      };

      let lastTime = -1;
      function loop() {
        if (!running) return;
        const now = performance.now();
        if (video.currentTime !== lastTime) {
          lastTime = video.currentTime;
          const r = poseLandmarker.detectForVideo(video, now);
          if (!completed) {
            awaitStartTick(r);
            processPose(r);
            if (postureMode) setPostureIndicator(bodyComplete && repState === 'down');
          } else {
            refreshBodyState(r);
          }
          draw(r);
          dwellTick(r);
        }
        if (!completed) {
          readyTick(now);
          cadenceTick(now);
        }
        requestAnimationFrame(loop);
      }

      function withTimeout(promise, ms, label) {
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error(label + ' (demoró ' + ms + 'ms)')), ms);
          promise.then(
            (v) => {
              clearTimeout(t);
              resolve(v);
            },
            (e) => {
              clearTimeout(t);
              reject(e);
            },
          );
        });
      }
      const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
      const MODEL_URL =
        'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';
      const MODEL_LOAD_MS = 20000;

      async function attemptCreate(label, make) {
        try {
          return await withTimeout(make('GPU'), MODEL_LOAD_MS, label + ' GPU');
        } catch (e) {
          log(label + ' GPU no disponible (' + e.message + '). Reintentando con CPU…');
          return await withTimeout(make('CPU'), MODEL_LOAD_MS, label + ' CPU');
        }
      }

      async function initModel() {
        statusText.textContent = 'Cargando modelo…';
        try {
          const vision = await withTimeout(
            FilesetResolver.forVisionTasks(WASM_URL),
            MODEL_LOAD_MS,
            'modelo',
          );
          poseLandmarker = await attemptCreate('pose', (delegate) =>
            PoseLandmarker.createFromOptions(vision, {
              baseOptions: { modelAssetPath: MODEL_URL, delegate },
              runningMode: 'VIDEO',
              numPoses: 1,
            }),
          );
          log('Modelo de pose cargado');
        } catch (e) {
          throw new Error('El modelo no cargó (' + e.message + ')');
        }
      }

      async function ensureOrientationSensor() {
        if (typeof DeviceOrientationEvent === 'undefined') return false;
        if (runningInsideReactNative) {
          // El WebView de Expo Go no entrega orientación sin gesto; la app lee
          // el sensor con expo-sensors y nos lo inyecta por este puente.
          post('sensor_request', {});
        } else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const perm = await DeviceOrientationEvent.requestPermission();
            if (perm !== 'granted') return false;
          } catch (e) {
            log('Sensor: ' + e.message);
            return false;
          }
        }
        window.addEventListener('deviceorientation', onDeviceOrientation);
        window.addEventListener('devicemotion', onDeviceMotion);
        return new Promise((res) => {
          const st = performance.now();
          (function ch() {
            if (orientationSupported) {
              res(true);
              return;
            }
            if (sensorUnavailable) {
              res(false);
              return;
            }
            if (performance.now() - st > SENSOR_CONFIRM_MS) {
              res(false);
              return;
            }
            requestAnimationFrame(ch);
          })();
        });
      }
      function onDeviceOrientation(ev) {
        if (ev.beta == null) return;
        betaHistory.push(ev.beta);
        if (betaHistory.length > 8) betaHistory.shift();
        const avg = betaHistory.reduce((a, b) => a + b, 0) / betaHistory.length;
        const dev = Math.abs(90 - Math.abs(avg));
        setOrientationState(dev <= VERTICAL_TOLERANCE);
      }
      function onDeviceMotion(ev) {
        const g = ev.accelerationIncludingGravity;
        if (!g || !Number.isFinite(g.y) || !Number.isFinite(g.z)) return;
        if (Math.hypot(g.y, g.z) < 1) return;
        const tilt = (Math.atan2(Math.abs(g.z), Math.abs(g.y)) * 180) / Math.PI;
        setOrientationState(tilt <= VERTICAL_TOLERANCE);
      }
      function setOrientationState(vertical, beta) {
        orientationSupported = true;
        deviceIsVertical = vertical;
        if (typeof beta === 'number' && Number.isFinite(beta)) {
          betaHistory.push(beta);
          if (betaHistory.length > 8) betaHistory.shift();
        }
        orientationBadge.style.display = 'flex';
        orientationBadge.className = 'badge ' + (deviceIsVertical ? '' : 'orientation-bad');
        orientationIcon.innerHTML = deviceIsVertical ? ICON.check : ICON.warning;
        orientationText.textContent = deviceIsVertical ? 'Vertical' : '¡Poné el celular vertical!';
      }

      // Puente nativo: la app (Expo) lee el sensor con expo-sensors y nos
      // inyecta la orientación. Dentro del WebView de Expo Go los eventos
      // deviceorientation/devicemotion NO llegan sin un gesto del usuario;
      // este hook evita depender del gesto y del WebView para el sensor.
      window.__resilienciaSetNativeOrientation = function (sample) {
        if (!sample) return;
        if (sample.available === false) {
          sensorUnavailable = true;
          return;
        }
        if (sample.available !== true || typeof sample.vertical !== 'boolean') return;
        setOrientationState(sample.vertical, sample.beta);
      };

      async function startCamera() {
        startBtn.disabled = true;
        startBtn.textContent = 'Confirmando sensor…';
        ensureAudio();
        const sensorOk = await ensureOrientationSensor();
        if (!sensorOk) {
          if (sensorConfirmRetries < 1) {
            sensorConfirmRetries += 1;
            statusText.textContent = 'Confirmando sensor de nuevo…';
            setTimeout(() => void startCamera(), 300);
            return;
          }
          sensorConfirmRetries = 0;
          log('Sensor no confirmado — modo verificado exige celular vertical');
          startBtn.disabled = false;
          startBtn.textContent = 'Reintentar';
          statusText.textContent = 'Sensor no confirmado';
          return;
        }
        sensorConfirmRetries = 0;
        try {
          if (!poseLandmarker) await initModel();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacing },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
          canvas.width = video.videoWidth || 480;
          canvas.height = video.videoHeight || 640;
          running = true;
          resetRepState();
          applyMirror();
          showExitButton();
          awaitStart();
          startBtn.style.display = 'none';
          stopBtn.style.display = 'block';
          statusText.textContent = 'En vivo';
          liveDot.classList.add('live');
          log(
            'Cámara activa · ' +
              cfg.name +
              ' · ' +
              (cfg.unit === 'seconds' ? targetVal + 's' : targetVal + ' reps'),
          );
          requestAnimationFrame(loop);
        } catch (e) {
          log('Error: ' + e.message);
          statusText.textContent = 'Sin acceso a cámara';
          startBtn.disabled = false;
          startBtn.textContent = 'Activar cámara';
        }
      }
      function stopCamera() {
        // No apagamos la cámara: entramos al estado de espera igual que al
        // completar, para ofrecer REPETIR / SALIR con el gesto.
        completed = true;
        statusText.textContent = 'Serie completa';
        stopBtn.style.display = 'none';
        startBtn.style.display = 'none';
        showActionButton('REPETIR', 'repeat');
        stateMsg.style.display = 'none';
        checklistHud.style.display = 'none';
        gestureHud.style.display = 'none';
        countdownOverlay.style.display = 'none';
        cadenceHud.style.display = 'none';
        hideLiveness();
        const total = sessionStartTime
          ? Math.round((performance.now() - sessionStartTime) / 1000)
          : 0;
        const value = currentValue();
        const tagEl = resultCard.querySelector('.verify-tag');
        if (MODE_RANKED) {
          const qualified =
            gestureStarted &&
            seriesOk &&
            value >= targetVal &&
            (livenessPassed || !livenessEnabled);
          verifyText.textContent = qualified
            ? 'Sesión enviada para validación — pendiente de ranking'
            : 'No califica para ranking';
          tagEl.classList.toggle('broken', !qualified);
        } else {
          verifyText.textContent = 'Verificado por pose';
          tagEl.classList.remove('broken');
        }
        resultReps.textContent = value;
        resultDetail.textContent =
          (targetUnit === 'reps' ? value + ' reps' : 'Tiempo validado ' + holdMs + 's') +
          ' · ' +
          total +
          's de sesión';
        resultCard.classList.add('show');
        post('complete', completePayload('Sesión finalizada'));
      }
      startBtn.onclick = startCamera;
      stopBtn.onclick = stopCamera;
      refreshHud();

      setTimeout(() => {
        if (!startBtn.disabled) startCamera();
      }, 700);
    </script>
  </body>
</html>
